<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLog">
<meta name="theme-color" content="#0E0E16">
<title>FitLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --bg:#0E0E16;
  --bg2:#16161F;
  --bg3:#1E1E2A;
  --card:#191922;
  --card2:#222230;
  --border:#2A2A3A;
  --text:#F4F4F9;
  --text2:#A0A0BA;
  --text3:#616178;
  --accent:#8B7FF9;
  --accent2:#B4ACFB;
  --accent-bg:rgba(139,127,249,0.14);
  --accent-glow:rgba(139,127,249,0.3);
  --green:#3DDC97;
  --green-bg:rgba(61,220,151,0.14);
  --amber:#FFB443;
  --amber-bg:rgba(255,180,67,0.14);
  --red:#FF6B6B;
  --red-bg:rgba(255,107,107,0.14);
  --teal:#2FD9E8;
  --teal-bg:rgba(47,217,232,0.14);
  --pink:#FF7EB6;
  --pink-bg:rgba(255,126,182,0.14);
  --blue:#4D9BFF;
  --blue-bg:rgba(77,155,255,0.14);
  --r-sm:14px; --r-md:18px; --r-lg:22px; --r-xl:28px;
  --shadow-card:0 4px 20px rgba(0,0,0,0.32);
  --shadow-soft:0 2px 12px rgba(0,0,0,0.22);
}
/* ══ ธีมสีประจำวัน (สีไทย) — dark ทั้งหมด เปลี่ยนเฉพาะสีหลัก+โทนพื้น ══
   สีเชิงความหมาย (เขียว=ดี/แดง=เตือน) คงเดิมทุกธีม เพื่อไม่ให้สื่อผิด */
[data-theme="sun"]{--accent:#FF6B6B;--accent2:#FF9E9E;--accent-bg:rgba(255,107,107,.14);--accent-glow:rgba(255,107,107,.3);
  --bg:#160E10;--bg2:#1F1618;--bg3:#2A1E20;--card:#221819;--card2:#302224;--border:#3A2A2C;}
[data-theme="mon"]{--accent:#FFD84D;--accent2:#FFE896;--accent-bg:rgba(255,216,77,.14);--accent-glow:rgba(255,216,77,.3);
  --bg:#16140A;--bg2:#1F1C12;--bg3:#2A261A;--card:#221F14;--card2:#302B1C;--border:#3A3424;}
[data-theme="tue"]{--accent:#FF7EB6;--accent2:#FFA9CE;--accent-bg:rgba(255,126,182,.14);--accent-glow:rgba(255,126,182,.3);
  --bg:#160E13;--bg2:#1F161B;--bg3:#2A1E25;--card:#22181D;--card2:#302229;--border:#3A2A33;}
[data-theme="wed"]{--accent:#3DDC97;--accent2:#7DEBBC;--accent-bg:rgba(61,220,151,.14);--accent-glow:rgba(61,220,151,.3);
  --bg:#0B1612;--bg2:#131F1A;--bg3:#1B2A24;--card:#14221C;--card2:#1C3029;--border:#243A32;}
[data-theme="thu"]{--accent:#FF9F45;--accent2:#FFC183;--accent-bg:rgba(255,159,69,.14);--accent-glow:rgba(255,159,69,.3);
  --bg:#16110A;--bg2:#1F1912;--bg3:#2A221A;--card:#221C14;--card2:#30261C;--border:#3A2F24;}
[data-theme="fri"]{--accent:#4D9BFF;--accent2:#8FC0FF;--accent-bg:rgba(77,155,255,.14);--accent-glow:rgba(77,155,255,.3);
  --bg:#0A1018;--bg2:#121821;--bg3:#1A212C;--card:#141B24;--card2:#1C2532;--border:#242E3A;}
[data-theme="sat"]{--accent:#A78BFA;--accent2:#C7B4FC;--accent-bg:rgba(167,139,250,.14);--accent-glow:rgba(167,139,250,.3);
  --bg:#110E16;--bg2:#19161F;--bg3:#231E2A;--card:#1B1822;--card2:#262230;--border:#302A3A;}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s;}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;}

/* ── scrollable body ── */
.scroll{flex:1;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(100px + 56px + env(safe-area-inset-bottom));}
::-webkit-scrollbar{display:none;}

/* ── date bar — ย้ายไปอยู่ด้านล่างเหนือ tabbar (thumb-friendly) ── */
.datebar{
  position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:0;right:0;
  max-width:430px;margin:0 auto;z-index:25;
  background:rgba(14,14,22,0.93);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);border-bottom:none;
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
}
.navbtn{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--accent2);font-size:20px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;
}
.navbtn:active{background:var(--card2);}
.navbtn:disabled{opacity:.25;}
.datemid{text-align:center;flex:1;}
.datemid .d{font-size:17px;font-weight:800;color:var(--text);}
.todaychip{
  margin-top:3px;background:var(--accent-bg);border:1px solid rgba(124,111,247,.3);
  color:var(--accent2);font-size:10px;font-weight:700;padding:2px 10px;
  border-radius:20px;cursor:pointer;letter-spacing:.5px;
}
.todaydot{font-size:10px;color:var(--accent);font-weight:700;margin-top:3px;letter-spacing:.5px;}
/* ── mini calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;}
.cal-wd{font-size:10px;font-weight:700;color:var(--text3);text-align:center;padding:4px 0;}
.cal-day{
  aspect-ratio:1;border-radius:10px;border:none;background:transparent;
  color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .12s;
}
.cal-day:hover{background:var(--bg3);}
.cal-day.today{color:var(--accent2);font-weight:800;}
.cal-day.sel{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 2px 10px var(--accent-glow);}
.cal-day.has-data::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;bottom:4px;left:50%;transform:translateX(-50%);}
.cal-day.has-data{position:relative;}
.cal-day.empty{cursor:default;opacity:0;}
.cal-day.future{opacity:.3;cursor:not-allowed;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.cal-nav button{background:var(--bg3);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;color:var(--text2);font-size:16px;cursor:pointer;}
.cal-nav .cal-month{font-size:15px;font-weight:800;color:var(--text);}

/* ── cards ── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);
}
.card-glow{box-shadow:0 0 0 1px var(--accent-glow),0 8px 32px rgba(0,0,0,.4);}
.lbl{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.num{font-variant-numeric:tabular-nums;}

/* ── icon frame (Soom-style rounded colored icon) ── */
.icf{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 2px 8px rgba(0,0,0,.28);
}
/* แสงสะท้อนแบบลูกแก้ว (glossy sheen) — จุดไฮไลท์มุมบนซ้าย */
.icf::before{
  content:"";position:absolute;top:-30%;left:-20%;width:80%;height:70%;
  background:radial-gradient(ellipse at 30% 30%, rgba(255,255,255,.4), rgba(255,255,255,0) 65%);
  border-radius:50%;pointer-events:none;
}
/* ไฮไลท์โค้งด้านบน ให้ดูเป็นผิวมันวาว */
.icf::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 42%);
}
.icf>*{position:relative;z-index:1;}
/* ปุ่ม quick action (บันทึกวันนี้) */
.qa-btn{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px 6px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:9px;transition:transform .15s,background .15s;
  font-size:12px;font-weight:700;color:var(--text);font-family:inherit;
}
.qa-btn:active{transform:scale(.96);background:var(--card2);}
.icf-accent{background:linear-gradient(145deg,rgba(139,127,249,.32),rgba(139,127,249,.11));}
.icf-green{background:linear-gradient(145deg,rgba(61,220,151,.32),rgba(61,220,151,.11));}
.icf-amber{background:linear-gradient(145deg,rgba(255,180,67,.32),rgba(255,180,67,.11));}
.icf-red{background:linear-gradient(145deg,rgba(255,107,107,.32),rgba(255,107,107,.11));}
.icf-teal{background:linear-gradient(145deg,rgba(47,217,232,.32),rgba(47,217,232,.11));}
.icf-pink{background:linear-gradient(145deg,rgba(255,126,182,.32),rgba(255,126,182,.11));}
.icf-blue{background:linear-gradient(145deg,rgba(77,155,255,.32),rgba(77,155,255,.11));}

/* ── progress bar ── */
.bartrack{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:14px;}
.barfill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* ── meal card ── */
.mealcard{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;margin-bottom:10px;
}
.mealhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mealhead .mname{font-weight:700;font-size:14px;}
.mealhead .mcal{font-size:11px;color:var(--text2);}
.addbtn{
  margin-left:auto;background:var(--accent-bg);border:1px solid rgba(124,111,247,.25);
  color:var(--accent2);font-size:11px;font-weight:700;padding:5px 12px;
  border-radius:20px;cursor:pointer;letter-spacing:.3px;
}
.foodrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
.foodrow .fn{font-size:13px;font-weight:500;color:var(--text);}
.foodrow .meta{font-size:11px;color:var(--text3);margin-top:1px;}
.foodrow .fcal{font-size:12px;font-weight:700;color:var(--text2);}
.delbtn{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}
.empty{font-size:12px;color:var(--text3);padding:4px 0 2px;}

/* ── stat boxes ── */
.statrow{display:flex;gap:8px;flex-wrap:wrap;}
.stat{
  flex:1;min-width:76px;background:var(--bg3);border:1px solid transparent;
  border-radius:var(--r-md);padding:13px 12px;text-align:center;
}
.stat.hl{background:var(--accent-bg);border-color:rgba(139,127,249,.2);}
.stat .sl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.stat .sv{font-size:21px;font-weight:800;color:var(--text);margin:2px 0 1px;}
.stat.hl .sv{color:var(--accent2);}
.stat .su{font-size:10px;color:var(--text3);}

/* ── macro bars ── */
.macro{flex:1;}
.macro .top{display:flex;justify-content:space-between;margin-bottom:4px;}
.macro .ml{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.macro .mv{font-size:10px;color:var(--text2);}
.macro .mt{height:4px;background:var(--bg3);border-radius:2px;}
.macro .mf{height:100%;border-radius:2px;transition:width .4s;}

/* ── forms ── */
.field{flex:1;}
.flbl{font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:600;letter-spacing:.3px;}
input,select{
  width:100%;padding:11px 13px;
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);
  font-size:14px;font-family:inherit;outline:none;color:var(--text);
  -webkit-appearance:none;appearance:none;
  transition:border-color .2s;
}
input:focus,select:focus{border-color:var(--accent);}
input:disabled{opacity:.5;cursor:not-allowed;}
input::placeholder{color:var(--text3);}
.row{display:flex;gap:8px;}

/* ── segments ── */
.seg{display:flex;gap:4px;background:var(--bg3);padding:3px;border-radius:var(--r-sm);border:1px solid var(--border);}
.seg button{
  flex:1;padding:8px 4px;border:none;border-radius:9px;
  background:none;color:var(--text3);font-weight:600;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .2s;
}
.seg button.on{
  background:var(--accent);color:#fff;font-weight:800;
  box-shadow:0 2px 8px var(--accent-glow);
}

/* ── buttons ── */
.btn{
  border:none;border-radius:var(--r-sm);padding:10px 18px;
  font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-glow);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:active{background:var(--card2);}
.btn-save{
  width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  border:none;border-radius:var(--r-md);padding:15px;
  font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px;
  box-shadow:0 4px 20px var(--accent-glow);transition:all .2s;
}
.btn-save:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.25);}

/* ── image picker ── */
.img-opts{display:flex;gap:8px;margin-bottom:12px;}
.imgbtn{
  flex:1;padding:18px 0;border:1px dashed var(--border);border-radius:var(--r-md);
  background:var(--bg3);display:flex;flex-direction:column;align-items:center;
  cursor:pointer;gap:6px;transition:border-color .2s;
}
.imgbtn:hover{border-color:var(--accent);}
.imgbtn .ic2{font-size:26px;}
.imgbtn .tx{font-size:11px;color:var(--text2);font-weight:600;}

/* ── badges/chips ── */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:6px 10px;font-size:12px;cursor:pointer;margin:0 5px 5px 0;
}
.chip .cc{font-size:10px;color:var(--text3);}
.chip:hover{border-color:var(--accent);}
.warn{font-size:12px;color:var(--amber);background:var(--amber-bg);border:1px solid rgba(251,191,36,.2);border-radius:var(--r-sm);padding:10px 12px;line-height:1.5;}
.note{font-size:12px;color:var(--accent2);background:var(--accent-bg);border:1px solid rgba(124,111,247,.2);border-radius:var(--r-sm);padding:10px 12px;line-height:1.5;}
.err{color:var(--red);font-size:12px;padding:2px 0;}
.success{color:var(--green);font-size:12px;}

/* ── goal bar ── */
.goalbar{margin-bottom:14px;}
.goalbar .top{display:flex;justify-content:space-between;margin-bottom:5px;}
.goalbar .gl{font-size:13px;font-weight:600;}
.goalbar .gv{font-size:11px;color:var(--text2);}
.goalbar .track{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.goalbar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:4px;}
.goalbar .gpct{font-size:10px;color:var(--text3);margin-top:3px;}

/* ── chart ── */
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.chart .cv{font-size:8px;color:var(--text3);}
.chart .cb{width:100%;border-radius:3px 3px 0 0;}
.chart .cd{font-size:7px;color:var(--text3);}

/* ── tabbar ── */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  background:rgba(14,14,22,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30;
}
.tabbar button{
  flex:1;background:none;border:none;cursor:pointer;padding:6px 0;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tabbar .ic{font-size:22px;transition:transform .2s;}
.tabbar .tl{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;}
.tabbar button.on .ic{transform:scale(1.1);}
.tabbar button.on .tl{color:var(--accent2);}

/* ── coach fab ── */
.fab{
  position:fixed;bottom:calc(56px + 56px + 12px + env(safe-area-inset-bottom));right:14px;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;font-size:22px;cursor:pointer;
  box-shadow:0 8px 24px var(--accent-glow);z-index:40;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.fab:active{transform:scale(.94);}
@media(min-width:458px){.fab{right:calc(50% - 215px + 14px);}}

/* ── overlay / sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);}
.sheet{
  background:var(--bg2);width:100%;max-width:430px;
  border-radius:24px 24px 0 0;padding:12px 18px 32px;
  max-height:92vh;overflow-y:auto;
  animation:slideUp .28s cubic-bezier(.16,1,.3,1);
  border-top:1px solid var(--border);
}
.handle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.sheetTitle{font-weight:800;font-size:17px;color:var(--text);margin-bottom:2px;}
.sheetSub{font-size:12px;color:var(--text3);margin-bottom:16px;}

@keyframes slideUp{from{transform:translateY(100%);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* ── coach chat ── */
.chatwrap{display:flex;flex-direction:column;height:88vh;}
.chathead{
  display:flex;align-items:center;gap:10px;
  padding-bottom:12px;border-bottom:1px solid var(--border);
  margin-bottom:12px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.chatbody{flex:1;overflow-y:auto;padding:2px 0;display:flex;flex-direction:column;gap:10px;}
.msg{display:flex;gap:8px;animation:fadeIn .2s ease;}
.msg.user{flex-direction:row-reverse;}
.bubble{
  max-width:82%;padding:10px 14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;
  border-radius:var(--r-lg);
}
.msg.ai .bubble{background:var(--card2);color:var(--text);border-radius:4px var(--r-lg) var(--r-lg) var(--r-lg);}
.msg.user .bubble{background:var(--accent);color:#fff;border-radius:var(--r-lg) 4px var(--r-lg) var(--r-lg);}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;}
.quick button{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:7px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.quick button:hover{border-color:var(--accent);color:var(--accent2);}
.chatinput{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
.chatinput input{border-radius:20px;background:var(--card);}
.sendbtn{
  width:42px;height:42px;border-radius:50%;border:none;

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   FitLog v3 — Dark Edition
   - แก้ JSON parse error (workout plan)
   - รูปจาก library + กล้อง
   - UI ใหม่ dark premium
   ============================================================ */

/* ══════════════════════════════════════
   TREND ENGINE — คำนวณค่าเฉลี่ยเคลื่อนที่ + แนวโน้ม
   หลักการ: ตัดสินใจจาก moving average ไม่ใช่ค่ารายวัน
══════════════════════════════════════ */
/* ค่าเฉลี่ยน้ำหนักย้อนหลัง N วันนับจาก endDate (interpolate จาก body log) */
function avgWeight(endDate,days){
  const body=LS.get(K.body,[]).filter(b=>b.weight!=null);
  if(!body.length)return null;
  const start=addDays(endDate,-(days-1));
  const inRange=body.filter(b=>b.date>=start&&b.date<=endDate);
  if(!inRange.length)return null;
  return{avg:+(inRange.reduce((a,b)=>a+b.weight,0)/inRange.length).toFixed(2),n:inRange.length};
}
/* แนวโน้มน้ำหนัก: เทียบ 7-day avg ปัจจุบัน กับ 7-day avg ของ N วันก่อน */
function weightTrend(endDate,windowDays=7){
  const now=avgWeight(endDate,windowDays);
  const prev=avgWeight(addDays(endDate,-windowDays),windowDays);
  if(!now||!prev)return null;
  const delta=+(now.avg-prev.avg).toFixed(2);
  const perWeek=+(delta/(windowDays/7)).toFixed(2);
  return{now:now.avg,prev:prev.avg,delta,perWeek,nNow:now.n,nPrev:prev.n,
    dir:delta<-0.15?"down":delta>0.15?"up":"flat"};
}
/* ค่าเฉลี่ยแคลอรี่ + confidence ย้อนหลัง N วัน (เฉพาะวันที่มีบันทึก) */
function avgIntake(endDate,days){
  let cal=0,n=0,confW=0,confTot=0;
  for(let i=0;i<days;i++){
    const d=addDays(endDate,-i);
    const fl=LS.get(K.food(d),[]);
    if(!fl.length)continue;
    const c=fl.reduce((a,f)=>a+(f.cal||0),0);
    cal+=c;n++;
    const dc=dayConfidence(d);
    if(dc!=null){confW+=c*dc;confTot+=c;}
  }
  if(!n)return null;
  return{avg:Math.round(cal/n),days:n,coverage:+(n/days).toFixed(2),
    conf:confTot?Math.round(confW/confTot):null};
}
/* ค่าเฉลี่ยเผาผลาญจากกิจกรรม N วัน */
function avgBurn(endDate,days){
  let burn=0,n=0;
  for(let i=0;i<days;i++){
    const d=addDays(endDate,-i);
    const c=LS.get(K.cardio(d),[]);
    if(c.length){burn+=c.reduce((a,x)=>a+(x.calories||0),0);n++;}
  }
  return n?Math.round(burn/n):0;
}
/* แนวโน้มรอบเอว */
function waistTrend(endDate,windowDays=14){
  const body=LS.get(K.body,[]).filter(b=>b.waist!=null);
  if(body.length<2)return null;
  const start=addDays(endDate,-windowDays);
  const recent=body.filter(b=>b.date>=start&&b.date<=endDate).sort((a,b)=>a.date<b.date?-1:1);
  if(recent.length<2)return null;
  const delta=+(recent[recent.length-1].waist-recent[0].waist).toFixed(1);
  return{first:recent[0].waist,last:recent[recent.length-1].waist,delta,
    dir:delta<-0.5?"down":delta>0.5?"up":"flat",n:recent.length};
}
/* Waist-to-Hip Ratio — มาตรฐาน WHO: เสี่ยงสูงถ้า >0.90(ชาย) / >0.85(หญิง) */
function calcWHR(waist,hip){
  if(!waist||!hip)return null;
  const whr=+(waist/hip).toFixed(2);
  return whr;
}
function whrRisk(whr,gender){
  if(whr==null)return null;
  const thr=gender==="female"?0.85:0.90;
  return whr>thr;
}
/* US Navy Body Fat % (Hodgdon-Beckett 1984) — หน่วย cm ทั้งหมด */
function calcNavyBF(waist,neck,height,gender,hip){
  if(!waist||!neck||!height)return null;
  let bf;
  if(gender==="female"){
    if(!hip)return null;
    bf=495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(height))-450;
  }else{
    bf=495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(height))-450;
  }
  if(!isFinite(bf)||bf<=0||bf>70)return null;
  return +bf.toFixed(1);
}

/* ══════════════════════════════════════
   WEIGHT NOISE FILTER — อธิบายเชิงคุณภาพว่าน้ำหนักที่ขึ้น/ลงกะทันหันน่าจะเป็นอะไร
   หลักการ: ใช้ข้อมูลโซเดียม/คาร์บ/deficit ที่บันทึกจริง ไม่ใช่แต่งตัวเลข % ลอยๆ
   (ไม่มีสูตรแยกน้ำ/ไกลโคเจน/ไขมันที่แม่นระดับนั้นจริงในทางสรีรวิทยา)
══════════════════════════════════════ */
/* ══════════════════════════════════════
   JOURNAL — บันทึกปัจจัยเชิงคุณภาพที่ AI/Engine ตรวจจากตัวเลขเองไม่ได้
   ใช้ประกอบ Weight Noise Filter ให้แม่นขึ้น (ไม่ต้องมีอุปกรณ์สวมใส่)
══════════════════════════════════════ */
const JOURNAL_TAGS=[
  {id:"alcohol",label:"ดื่มแอลกอฮอล์",icon:"🍺"},
  {id:"stressed",label:"เครียด",icon:"😰"},
  {id:"sick",label:"ไม่สบาย",icon:"🤒"},
  {id:"poorSleep",label:"นอนน้อย/ไม่ดี",icon:"😴"},
  {id:"period",label:"ประจำเดือน",icon:"🩸",femaleOnly:true},
  {id:"travel",label:"เดินทาง/นอกบ้าน",icon:"✈️"},
  {id:"hardWorkout",label:"ออกกำลังหนักผิดปกติ",icon:"🔥"},
];
function getJournal(date){return LS.get(K.journal(date),{tags:[],note:""});}
function toggleJournalTag(date,tagId){
  const j=getJournal(date);
  j.tags=j.tags.includes(tagId)?j.tags.filter(t=>t!==tagId):[...j.tags,tagId];
  LS.set(K.journal(date),j);
  return j;
}
function setJournalNote(date,note){
  const j=getJournal(date);j.note=note;LS.set(K.journal(date),j);
}
function journalLabel(tagId){return JOURNAL_TAGS.find(t=>t.id===tagId)?.label||tagId;}

function weightNoiseExplain(date){
  const body=LS.get(K.body,[]).filter(b=>b.weight!=null).sort((a,b)=>a.date<b.date?-1:1);
  const idx=body.findIndex(b=>b.date===date);
  if(idx<1)return null; // ต้องมีค่าเมื่อวานเทียบ
  const today=body[idx],yest=body[idx-1];
  const jump=+(today.weight-yest.weight).toFixed(2);
  if(Math.abs(jump)<0.4)return null; // แกว่งน้อย ไม่ต้องอธิบาย

  const yFood=LS.get(K.food(yest.date),[]);
  const ySodium=yFood.reduce((a,f)=>a+(f.sodium||0),0);
  const yCarb=yFood.reduce((a,f)=>a+(f.carb||0),0);
  const yCal=yFood.reduce((a,f)=>a+f.cal,0);
  const avgC=avgIntake(addDays(yest.date,-1),7);
  const carbHigh=avgC&&yCarb>0; // ใช้ deficit วันนั้นเทียบเฉลี่ยเป็นตัวชี้วัดหลักแทน (มีข้อมูลกว่า)
  const highSodium=ySodium>2500;
  const bigMeal=avgC&&yCal>avgC.avg*1.25;
  const yj=getJournal(yest.date); // journal ของเมื่อวาน — ปัจจัยที่ตัวเลขเดาไม่ได้

  const reasons=[];
  if(jump>0){
    if(highSodium)reasons.push(`โซเดียมสูง ${ySodium}mg เมื่อวาน`);
    if(bigMeal)reasons.push(`กินเกินเฉลี่ยมาก (${yCal} vs ${avgC.avg} kcal)`);
    if(yj.tags.includes("alcohol"))reasons.push("ดื่มแอลกอฮอล์เมื่อวาน (กักน้ำ)");
    if(yj.tags.includes("period"))reasons.push("ช่วงมีประจำเดือน (กักน้ำตามฮอร์โมน)");
    if(yj.tags.includes("stressed"))reasons.push("เครียดเมื่อวาน (คอร์ติซอลสูง → กักน้ำ)");
    if(yj.tags.includes("hardWorkout"))reasons.push("ออกกำลังหนักผิดปกติ (กล้ามเนื้อบวมซ่อมแซม)");
    if(yj.tags.includes("travel"))reasons.push("เดินทาง/นอกบ้าน (กินนอกแผน มักเค็ม/แคลสูงกว่าปกติ)");
    if(!reasons.length)reasons.push("อาจเป็นน้ำ/เกลือแร่/อาหารในทางเดินอาหารตามธรรมชาติ");
    return{jump,verdict:"likely-water",
      text:`น้ำหนักขึ้น +${jump}kg — ${reasons.join(", ")} มักเป็นน้ำ ไม่ใช่ไขมันสะสมจริง (ไขมัน 1kg ต้องเกิน ~7,700 kcal สะสม ซึ่งใน 1 วันแทบเป็นไปไม่ได้)`};
  }else{
    if(yj.tags.includes("sick"))reasons.push("ไม่สบายเมื่อวาน (กินน้อย/ท้องเสีย → น้ำหาย)");
    if(yj.tags.includes("poorSleep"))reasons.push("นอนน้อยเมื่อวาน (ไกลโคเจนลด)");
    const extra=reasons.length?` — ${reasons.join(", ")}`:"";
    return{jump,verdict:"likely-water-loss",
      text:`น้ำหนักลด ${jump}kg ในวันเดียว${extra} — เร็วกว่าอัตราที่ไขมันจะลดได้จริง (ไขมัน 1kg ต้อง deficit สะสม ~7,700 kcal) ส่วนใหญ่เป็นน้ำ/ไกลโคเจนที่ลดจากมื้อก่อนหน้า ไม่ต้องดีใจเกินไป ให้ดู 7-day average แทน`};
  }
}

/* ══════════════════════════════════════
   ENERGY AUDIT — เทียบ deficit ที่คำนวณ vs น้ำหนักที่เปลี่ยนจริง
══════════════════════════════════════ */
const KCAL_PER_KG=7700;
/* ══════════════════════════════════════
   ADAPTIVE TDEE — เรียนรู้ TDEE จริงจากผลลัพธ์ แทนสูตรตายตัว
   เบรก 5 ชั้น: ปรับช้า / มีเพดาน / ใช้เฉพาะข้อมูลสะอาด / เฉพาะวันจันทร์ / ปิดได้
══════════════════════════════════════ */
const TDEE_ADJ={
  MAX_STEP:50,        // ปรับได้สูงสุด 50 kcal ต่อครั้ง (กันกระโดด)
  MAX_DEVIATE:0.20,   // เบี่ยงจากสูตรได้ไม่เกิน ±20%
  MIN_CONF:70,        // ต้องมี confidence อย่างน้อย 70%
  MIN_DAYS:10,        // ต้องบันทึกอย่างน้อย 10/14 วัน
  WINDOW:14
};
/* อ่านค่าปรับสะสมปัจจุบัน */
function getTdeeAdj(){
  const a=LS.get(K.tdeeAdj,null);
  if(!a||a.enabled===false)return{delta:0,enabled:a?a.enabled:true,history:a?.history||[],lastRun:a?.lastRun||null};
  return{delta:a.delta||0,enabled:true,history:a.history||[],lastRun:a.lastRun||null};
}
function setTdeeAdjEnabled(on){
  const a=LS.get(K.tdeeAdj,{delta:0,history:[]});
  a.enabled=on;LS.set(K.tdeeAdj,a);
}
function resetTdeeAdj(){LS.del(K.tdeeAdj);}

/* คำนวณว่า TDEE จริงควรเป็นเท่าไหร่ จากผลลัพธ์จริง (ยังไม่บันทึก แค่คำนวณ) */
function computeAdaptiveTdee(endDate){
  const p=LS.get(K.profile,null);if(!p)return null;
  const base=computeTargets(p,latestBody(),{raw:true});
  const formulaTdee=base.tdee;
  const intake=avgIntake(endDate,TDEE_ADJ.WINDOW);
  if(!intake||intake.days<TDEE_ADJ.MIN_DAYS)
    return{status:"insufficient-days",days:intake?.days||0,need:TDEE_ADJ.MIN_DAYS,formulaTdee};
  const conf=intake.conf??0;
  if(conf<TDEE_ADJ.MIN_CONF)
    return{status:"low-confidence",conf,need:TDEE_ADJ.MIN_CONF,formulaTdee};
  const wt=weightTrend(endDate,7);
  if(!wt||wt.nNow<4||wt.nPrev<4)
    return{status:"insufficient-weight",formulaTdee};

  // TDEE จริง = แคลอรี่ที่กิน + (พลังงานที่ร่างกายเสีย/ได้จากน้ำหนักที่เปลี่ยน)
  // น้ำหนักลด = ร่างกายใช้มากกว่าที่กิน → TDEE สูงกว่า intake
  const burn=avgBurn(endDate,TDEE_ADJ.WINDOW);
  const kgPerDay=wt.perWeek/7;
  const impliedTdee=Math.round(intake.avg+burn-(kgPerDay*KCAL_PER_KG));

  // เบรกชั้น 2: เพดาน ±20% จากสูตร
  const lo=Math.round(formulaTdee*(1-TDEE_ADJ.MAX_DEVIATE));
  const hi=Math.round(formulaTdee*(1+TDEE_ADJ.MAX_DEVIATE));
  const clamped=Math.min(hi,Math.max(lo,impliedTdee));
  const wasClamped=impliedTdee!==clamped;

  const cur=getTdeeAdj();
  const currentTdee=formulaTdee+cur.delta;
  // เบรกชั้น 1: ขยับได้ทีละ 50 kcal
  const rawStep=clamped-currentTdee;
  const step=Math.max(-TDEE_ADJ.MAX_STEP,Math.min(TDEE_ADJ.MAX_STEP,rawStep));
  const newDelta=Math.round(cur.delta+step);
  const newTdee=formulaTdee+newDelta;

  return{status:"ok",formulaTdee,currentTdee,impliedTdee,clamped,wasClamped,
    step:Math.round(step),newDelta,newTdee,conf,intake,burn,trend:wt,
    lo,hi,enabled:cur.enabled,pendingChange:Math.abs(step)>=5};
}
/* บันทึกค่าปรับ (เรียกเมื่อผู้ใช้ยืนยัน หรือ auto วันจันทร์) */
function applyTdeeAdj(endDate){
  const r=computeAdaptiveTdee(endDate);
  if(!r||r.status!=="ok")return null;
  const a=LS.get(K.tdeeAdj,{delta:0,history:[],enabled:true});
  a.delta=r.newDelta;a.lastRun=endDate;
  a.history=[...(a.history||[]),{date:endDate,delta:r.newDelta,tdee:r.newTdee,implied:r.impliedTdee,conf:r.conf}].slice(-12);
  LS.set(K.tdeeAdj,a);
  return r;
}

function energyAudit(endDate,days=7){
  const p=LS.get(K.profile,null);if(!p)return null;
  const t=computeTargets(p,latestBody());
  const intake=avgIntake(endDate,days);
  if(!intake||intake.days<Math.ceil(days*0.6))return{status:"insufficient",days:intake?.days||0,need:Math.ceil(days*0.6)};
  const burn=avgBurn(endDate,days);
  const tdee=t.tdee+burn;
  const dailyDeficit=Math.round(tdee-intake.avg);
  const cumDeficit=dailyDeficit*intake.days;
  const expectedKg=+(cumDeficit/KCAL_PER_KG).toFixed(2);
  const wt=weightTrend(endDate,days);
  if(!wt)return{status:"no-weight",dailyDeficit,expectedKg,intake,tdee};
  const actualKg=wt.delta;
  const mismatch=+((-expectedKg)-actualKg).toFixed(2);
  const conf=intake.conf??70;
  let status="ok";
  if(Math.abs(mismatch)>0.4){status=conf>=70?"mismatch":"mismatch-lowconf";}
  return{status,dailyDeficit,cumDeficit,expectedKg:-expectedKg,actualKg,mismatch,
    intake,burn,tdee,conf,trend:wt};
}

/* ══════════════════════════════════════
   DECISION ENGINE — ตัดสินใจว่าควรปรับแคลอรี่ไหม
   กติกา: ต้อง 14 วัน + confidence>=70% + ไม่ต่ำกว่า BMR
══════════════════════════════════════ */
function calorieDecision(endDate){
  const p=LS.get(K.profile,null);if(!p)return null;
  const activeOv=getOverride(endDate);
  const lb=latestBodyMerged();
  const t=computeTargets(p,latestBody());
  const bmr=lb?.bmr||t.bmr;
  const intake=avgIntake(endDate,14);
  const wt=weightTrend(endDate,7);
  const waist=waistTrend(endDate,14);
  const dt=dayTarget(endDate,t);

  // 1) ข้อมูลไม่พอ
  if(!intake||intake.days<10)
    return{action:"wait",reason:`บันทึกอาหารแค่ ${intake?.days||0}/14 วัน — ต้องมีอย่างน้อย 10 วันถึงจะประเมินได้`,icon:"📝"};
  if(!wt||wt.nNow<4||wt.nPrev<4)
    return{action:"wait",reason:"ข้อมูลน้ำหนักยังไม่พอ (ต้องชั่งอย่างน้อย 4 ครั้งใน 2 ช่วงสัปดาห์)",icon:"⚖️"};

  // 2) confidence ต่ำ → ห้ามตัดสินใจ
  const conf=intake.conf??70;
  if(conf<70)
    return{action:"improve-data",reason:`ความแม่นยำข้อมูล ${conf}% — ต่ำเกินไปที่จะปรับแคลอรี่ ลองกรอกค่าจากฉลาก/ชั่งน้ำหนักอาหารสัก 1 สัปดาห์`,icon:"🟠",conf};

  // ผู้ใช้ตั้งเป้าเฉพาะกิจไว้ → เคารพการตัดสินใจ แต่ยังเฝ้าระวังความปลอดภัย
  if(activeOv){
    const left=daysLeftOverride(endDate,activeOv);
    const fastLoss=wt.perWeek<0&&wt.now&&Math.abs(wt.perWeek/wt.now*100)>1.5;
    if(fastLoss)
      return{action:"increase",amount:150,newTarget:dayTarget(endDate,t).cal+150,
        reason:`อยู่ในช่วงเป้าเฉพาะกิจ แต่ลดเร็วมาก (${Math.abs(wt.perWeek).toFixed(2)} kg/สัปดาห์) — แนะนำผ่อนลงเพื่อความปลอดภัย`,icon:"⚠️",conf,override:activeOv};
    return{action:"hold",reason:`อยู่ในช่วงเป้าเฉพาะกิจ ${activeOv.delta>0?"+":""}${activeOv.delta} kcal${activeOv.reason?` (${activeOv.reason})`:""} — เหลืออีก ${left} วัน แนวโน้มยังปลอดภัย`,icon:"⚡",conf,override:activeOv};
  }

  const wPerWeek=wt.perWeek;
  const curW=wt.now;
  const lossPctPerWeek=curW?Math.abs(wPerWeek/curW*100):0;
  const goal=p.targetWeight&&curW?(p.targetWeight<curW?"lose":p.targetWeight>curW?"gain":"maintain"):"lose";

  // 3) ลดเร็วเกินไป → เพิ่มแคล (กันเสียกล้าม)
  if(goal==="lose"&&wPerWeek<0&&lossPctPerWeek>1.0)
    return{action:"increase",amount:150,newTarget:dt.cal+150,
      reason:`ลดเร็วเกินไป (${Math.abs(wPerWeek).toFixed(2)} kg/สัปดาห์ = ${lossPctPerWeek.toFixed(1)}% ของน้ำหนักตัว) เสี่ยงสูญเสียกล้ามเนื้อ`,icon:"⬆️",conf};

  // 4) น้ำหนักนิ่ง/ขึ้น + เอวไม่ลด → ลดแคล
  if(goal==="lose"&&(wt.dir==="flat"||wt.dir==="up")){
    const waistOk=waist&&waist.dir==="down";
    if(waistOk)
      return{action:"hold",reason:`น้ำหนักนิ่ง แต่รอบเอวลด ${Math.abs(waist.delta)} cm — กำลัง recomposition (ลดไขมัน+สร้างกล้าม) ไม่ต้องปรับ`,icon:"💪",conf};
    const newT=dt.cal-150;
    if(newT<bmr)
      return{action:"hold",reason:`น้ำหนักยังไม่ลง แต่ลดแคลอีกจะต่ำกว่า BMR (${bmr}) — ควรเพิ่มกิจกรรมแทนการลดอาหาร`,icon:"🏃",conf};
    return{action:"decrease",amount:150,newTarget:newT,
      reason:`น้ำหนัก${wt.dir==="up"?"เพิ่มขึ้น":"นิ่ง"} ${wt.delta>0?"+":""}${wt.delta} kg ใน 7 วัน และรอบเอวไม่ลด — ควรลดแคลอรี่`,icon:"⬇️",conf};
  }

  // 5) กำลังไปได้ดี
  if(goal==="lose"&&wt.dir==="down")
    return{action:"hold",reason:`กำลังลดในอัตราที่ดี (${Math.abs(wPerWeek).toFixed(2)} kg/สัปดาห์) — รักษาแผนเดิมไว้`,icon:"✅",conf};

  return{action:"hold",reason:"แนวโน้มอยู่ในเกณฑ์ปกติ ไม่ต้องปรับ",icon:"✅",conf};
}

/* ══ CONFIDENCE SCORE ══
   ระดับความน่าเชื่อถือของข้อมูลอาหาร (ระบบให้อัตโนมัติ) */
const CONF={MANUAL:95,FAV:95,AI_EDITED:85,AI_PHOTO:70,AI_TEXT:60,AI_COACH:60};
/* confidence ของทั้งวัน = ถ่วงน้ำหนักตามแคลอรี่ */
function dayConfidence(date){
  const food=LS.get(K.food(date),[]);
  if(!food.length)return null;
  const totCal=food.reduce((a,f)=>a+(f.cal||0),0);
  if(!totCal)return null;
  const w=food.reduce((a,f)=>a+(f.cal||0)*(f.conf??CONF.AI_PHOTO),0);
  return Math.round(w/totCal);
}

function getDiagram(name){
  const n=(name||"").toLowerCase();
  if(/สควอท|squat|goblet|front squat|hack squat/.test(n))return EXERCISE_DIAGRAMS.squat;
  if(/เดดลิฟท์|deadlift/.test(n)&&!/romanian|rdl|สติฟ|stiff/.test(n))return EXERCISE_DIAGRAMS.deadlift;
  if(/เบนช์|bench press|chest press|flat press|incline press|decline press/.test(n))return EXERCISE_DIAGRAMS.bench;
  if(/วิดพื้น|push.?up|pushup/.test(n))return EXERCISE_DIAGRAMS.pushup;
  if(/ดึงข้อ|pull.?up|chin.?up|lat pull/.test(n))return EXERCISE_DIAGRAMS.pullup;
  if(/โอเวอร์เฮด|overhead press|shoulder press|military|ohp|dumbbell press/.test(n)&&!/bench/.test(n))return EXERCISE_DIAGRAMS.ohp;
  if(/โร่|bent.?over.*row|barbell row|dumbbell row|cable row|seated row|t.bar row/.test(n))return EXERCISE_DIAGRAMS.row;
  if(/ลันจ์|lunge/.test(n))return EXERCISE_DIAGRAMS.lunge;
  if(/แพลงค์|plank/.test(n))return EXERCISE_DIAGRAMS.plank;
  if(/เคิร์ล|bicep curl|dumbbell curl|barbell curl/.test(n))return EXERCISE_DIAGRAMS.curl;
  if(/hip thrust|กลูท|glute bridge|hip hinge/.test(n))return EXERCISE_DIAGRAMS.hipthrust;
  if(/lateral raise|ยกข้าง|side raise|dumbbell lateral/.test(n))return EXERCISE_DIAGRAMS.lateral;
  if(/ครัน|crunch|sit.?up|ab wheel/.test(n))return EXERCISE_DIAGRAMS.crunch;

  return null;
}

function mifflin(p,w){return p.gender==="male"?10*w+6.25*p.height-5*p.age+5:10*w+6.25*p.height-5*p.age-161;}

/* รวมค่าล่าสุดของแต่ละ field — ถ้าวันล่าสุดบางค่าว่าง ย้อนดึงจาก record ก่อนหน้าที่มีค่า */
function latestBodyMerged(){
  const b=LS.get(K.body,[]);
  if(!b.length)return null;
  const sorted=[...b].sort((a,c)=>a.date<c.date?1:-1);
  const fields=["weight","bmi","bodyFat","fatMass","muscleMass","skeletalMuscle","bmr","heartRate","waterPct","proteinPct","visceralFat","subcutaneousFat","boneMass","metabolicAge","waist","hip","neck"];
  const merged={date:sorted[0].date,_dates:{}};
  fields.forEach(f=>{
    for(const rec of sorted){
      if(rec[f]!=null){merged[f]=rec[f];merged._dates[f]=rec.date;break;}
    }
  });
  return merged;
}
/* ประเมินแคลจากเวท: MET 5.0 (vigorous weight training) × น้ำหนัก(kg) × เวลา(ชม.)
   เวลาประเมินจากจำนวนเซ็ตรวม (~3 นาที/เซ็ต รวมพัก) ถ้าหาเซ็ตไม่ได้ใช้ ~4 นาที/ท่า */
function estimateWeightKcal(exercises,checkedNames,bodyWeight){
  const MET=5.0,w=bodyWeight||70;
  let totalMin=0;
  exercises.forEach(ex=>{
    if(!checkedNames.includes(ex.name))return;
    const m=(ex.muscle||"").toLowerCase(),n=(ex.name||"").toLowerCase();
    // ข้ามท่าคาร์ดิโอ (นาฬิกาวัดแยกแล้ว)
    if(/cardio|คาร์ดิโอ|เดิน|วิ่ง|ปั่น|ว่าย|zone 2|treadmill|run|walk|cycl|row machine/.test(m+" "+n))return;
    // หาจำนวนเซ็ตจาก sets เช่น "4x10" → 4 เซ็ต
    const setMatch=(ex.sets||"").match(/(\d+)\s*[xX×]/);
    const sets=setMatch?+setMatch[1]:0;
    totalMin+=sets>0?sets*3:4; // 3 นาที/เซ็ต (รวมพัก) หรือ 4 นาที/ท่าถ้าไม่รู้เซ็ต
  });
  if(totalMin<=0)return{kcal:0,min:0};
  const kcal=Math.round(MET*w*(totalMin/60));
  return{kcal,min:totalMin};
}
/* คำนวน HR zone ด้วย Karvonen (ใช้ resting HR ล่าสุดจากเครื่องชั่ง ถ้าไม่มีใช้ 60) */
function hrZone(age,restingHR){
  if(!age)return null;
  const rest=restingHR||60;
  const maxHR=220-age;
  const hrr=maxHR-rest;
  const z=(lo,hi)=>({min:Math.round(hrr*lo+rest),max:Math.round(hrr*hi+rest)});
  return{
    maxHR,rest,usedDefault:!restingHR,
    zones:[
      {n:1,name:"Recovery",th:"ฟื้นตัว",...z(0.5,0.6),color:"var(--teal)"},
      {n:2,name:"Endurance",th:"เดินชัน/Zone 2",...z(0.6,0.7),color:"var(--green)"},
      {n:3,name:"Aerobic",th:"คาร์ดิโอต่อเนื่อง",...z(0.7,0.8),color:"var(--amber)"},
      {n:4,name:"Threshold",th:"วิ่งแรง/HIIT",...z(0.8,0.9),color:"var(--red)"},
      {n:5,name:"Max",th:"สปรินต์สุดแรง",...z(0.9,1.0),color:"var(--accent2)"},
    ]
  };
}
function computeTargets(p,body,opts){
  const w=body?.weight??p.weight??70;
  const bmr=Math.round(body?.bmr??mifflin(p,w));
  const formulaTdee=Math.round(bmr*(p.activity||1.375));
  // ใช้ TDEE ที่เรียนรู้จากผลลัพธ์จริง (ถ้าเปิดใช้) — opts.raw=true เพื่อขอค่าสูตรดิบ กันคำนวณซ้อน
  let tdee=formulaTdee;
  if(!opts?.raw){
    const adj=getTdeeAdj();
    if(adj.enabled&&adj.delta)tdee=formulaTdee+adj.delta;
  }
  const bf=body?.bodyFat??null;
  const lean=bf?w*(1-bf/100):w*0.78;
  const dir=p.targetWeight?(p.targetWeight<w?"lose":p.targetWeight>w?"gain":"maintain"):"lose";
  let cal=dir==="lose"?tdee-500:dir==="gain"?tdee+250:tdee;
  cal=Math.max(1200,Math.round(cal));
  const protein=Math.round(lean*2.4);
  const fat=Math.round(cal*0.25/9);
  const carb=Math.max(0,Math.round((cal-protein*4-fat*9)/4));
  return{bmr,tdee,formulaTdee,tdeeAdjusted:tdee!==formulaTdee,cal,protein,carb,fat,lean:Math.round(lean*10)/10,bf};
}
/* ══════════════════════════════════════
   MEAL PRIORITY ENGINE — คำนวณลำดับการเติมสารอาหาร (deterministic ไม่ให้ AI เดา)
   หลักการ: 1) โปรตีนมาก่อนเสมอ 2) คาร์บเติมเฉพาะถ้าขาดเกิน 30g 3) ถ้า fat budget ตึง ให้เลือกโปรตีนไขมันต่ำ
══════════════════════════════════════ */
function mealPriorityEngine(eaten,target){
  const proteinGap=Math.max(0,Math.round(target.protein-eaten.p));
  const carbGap=Math.max(0,Math.round(target.carb-eaten.cb));
  const fatBudget=Math.max(0,Math.round(target.fat-eaten.ft));
  const calBudget=Math.max(0,Math.round(target.cal-eaten.c));

  const steps=[];
  // ขั้น 1: โปรตีนมาก่อนเสมอ
  if(proteinGap>0)steps.push({priority:1,type:"protein",gap:proteinGap,note:`เติมโปรตีนให้ครบก่อน — ขาดอีก ${proteinGap}g`});
  // ขั้น 2: คาร์บ เฉพาะถ้าขาดเกิน threshold (30g) — ถ้าขาดน้อยกว่านี้ไม่ต้องเน้น
  const carbThreshold=30;
  if(carbGap>=carbThreshold)steps.push({priority:2,type:"carb",gap:carbGap,note:`คาร์บขาดเกิน ${carbThreshold}g (ขาด ${carbGap}g) — ควรเติม`});
  else if(carbGap>0)steps.push({priority:3,type:"carb-optional",gap:carbGap,note:`คาร์บขาดแค่ ${carbGap}g — ไม่จำเป็นต้องเน้น เติมได้ถ้าอยาก`});
  // ขั้น 3: fat budget ตึง แต่โปรตีนยังขาด → บังคับเลือกแหล่งโปรตีนไขมันต่ำ
  const fatTight=fatBudget<15&&proteinGap>0;
  if(fatTight)steps.push({priority:1.5,type:"lean-protein-required",note:`ไขมันเหลือแค่ ${fatBudget}g แต่โปรตีนยังขาด — ต้องเลือกแหล่งโปรตีนไขมันต่ำ (อกไก่ไม่ติดหนัง/ปลา/ไข่ขาว/เวย์) เท่านั้น`});

  steps.sort((a,b)=>a.priority-b.priority);
  return{proteinGap,carbGap,fatBudget,calBudget,fatTight,steps,
    summary:steps.map(s=>s.note).join(" → ")||"สารอาหารครบเป้าหมายแล้ว"};
}
/* ดึงเป้าแคลอรี่เฉพาะวัน (calorie banking) ถ้ามี ไม่งั้น fallback */
/* ══ INFORMED OVERRIDE ══
   ผู้ใช้ยืนยันปรับเป้าเองแม้ Engine ไม่แนะนำ (รู้ความเสี่ยงแล้ว)
   เก็บเป็นช่วงเวลาจำกัด ไม่ใช่ baseline ถาวร */
function getOverride(date){
  const o=LS.get(K.override,null);
  if(!o||!o.until||!o.delta)return null;
  if(date>o.until)return null;          // หมดอายุแล้ว
  if(o.from&&date<o.from)return null;   // ยังไม่เริ่ม
  return o;
}
function daysLeftOverride(date,o){
  if(!o)return 0;
  return Math.max(0,Math.round((new Date(o.until+"T00:00:00")-new Date(date+"T00:00:00"))/86400000));
}
function setOverride(delta,days,reason){
  const from=todayStr();
  const o={delta:Math.round(delta),from,until:addDays(from,Math.max(1,days)),reason:reason||"",createdAt:from};
  LS.set(K.override,o);return o;
}
function clearOverride(){LS.del(K.override);}

function dayTarget(date,baseTargets){
  const o=LS.get(K.dcal(date),null);
  if(o&&typeof o.cal==="number")return{cal:o.cal,note:o.note||null,banked:true};
  // override ที่ผู้ใช้ยืนยันเอง (มีวันหมดอายุ)
  const ov=getOverride(date);
  if(ov){
    const p=LS.get(K.profile,null);
    const bmr=latestBodyMerged()?.bmr||baseTargets.bmr;
    // เพดานล่างเพื่อความปลอดภัย: ไม่ต่ำกว่า 1500 (ชาย) / 1200 (หญิง) และไม่ต่ำกว่า 80% ของ BMR
    const hardFloor=Math.max(p?.gender==="female"?1200:1500,Math.round(bmr*0.8));
    const raw=baseTargets.cal+ov.delta;
    const capped=Math.max(hardFloor,raw);
    return{cal:Math.round(capped),note:ov.reason||null,banked:false,override:true,ov,capped:raw<hardFloor,floor:hardFloor};
  }
  return{cal:baseTargets.cal,note:null,banked:false};
}

function impliedWeight(body,tbf){
  if(!body?.bodyFat||!tbf)return null;
  const lean=body.weight*(1-body.bodyFat/100);
  return Math.round(lean/(1-tbf/100)*10)/10;
}

function getKey(){return LS.get(K.key,"")||"";}
async function callClaude({system,messages,max_tokens=1200}){
  const key=getKey();
  if(!key)throw new Error("NO_KEY");
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODEL,max_tokens,...(system?{system}:{}),messages})
    });
  }catch(netErr){
    throw new Error("NETWORK:"+(netErr.message||netErr));
  }
  if(!res.ok){
    const t=await res.text();
    let detail=t;
    try{const j=JSON.parse(t);detail=(j.error&&(j.error.message||j.error.type))||t;}catch(_){}
    throw new Error(res.status+": "+String(detail).slice(0,200));
  }
  const data=await res.json();
  const out=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  if(!out)throw new Error("EMPTY: API ตอบกลับแต่ไม่มีข้อความ (stop_reason: "+(data.stop_reason||"?")+")");
  return out;
}

/* ── robust JSON parser (แก้ bug หลัก) ── */
function extractJSON(txt){
  // ลอง extract JSON จาก ```json ... ``` ก่อน
  const fence=txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence)txt=fence[1];
  txt=txt.trim();
  // ถ้ามี marker @@@JSON@@@ (ใช้ตอนให้ AI คิด reasoning นำหน้าก่อนตอบ JSON)
  // ให้ตัดทุกอย่างก่อนหน้าออกไปเลย กันเผลอไปจับวงเล็บปีกกาที่หลุดอยู่ในข้อความ reasoning
  const markerIdx=txt.lastIndexOf("@@@JSON@@@");
  if(markerIdx>=0)txt=txt.slice(markerIdx+"@@@JSON@@@".length).trim();
  // หาก block เริ่มด้วย { หรือ [
  const start=txt.search(/[{\[]/);
  if(start>0)txt=txt.slice(start);
  // ตัด trailing text หลัง JSON จบ
  let depth=0,end=0,inStr=false,esc=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(esc){esc=false;continue;}
    if(c==="\\"&&inStr){esc=true;continue;}
    if(c==='"')inStr=!inStr;
    if(!inStr){
      if(c==="{"||c==="[")depth++;
      if(c==="}"||c==="]"){depth--;if(depth===0){end=i+1;break;}}
    }
  }
  if(end>0)txt=txt.slice(0,end);
  return JSON.parse(txt);
}

function aiError(e){
  const m=String(e.message||e);
  if(m.includes("NO_KEY"))return"⚠️ ยังไม่ได้ใส่ API key (ไปที่ เพิ่มเติม → 🔑 API Key)";
  if(m.startsWith("NETWORK:"))return"⚠️ เชื่อมต่อ API ไม่ได้ (network/CORS) — เช็คเน็ต หรือลองเปิดในเบราว์เซอร์: "+m.slice(8,90);
  if(m.startsWith("EMPTY:"))return"⚠️ "+m.slice(6);
  if(m.startsWith("PARSE:"))return"⚠️ "+m.slice(6);
  if(m.includes("Unexpected end of JSON")||m.includes("Unexpected EOF")||(m.includes("JSON")&&m.includes("Unexpected")))
    return"⚠️ ข้อมูลเยอะเกินไปจนคำตอบถูกตัดกลางคัน — ลองแบ่งพิมพ์เป็น 2 รอบ หรือลองใหม่อีกครั้ง";
  if(m.includes("401")||m.includes("authentication"))return"⚠️ API key ไม่ถูกต้อง";
  if(m.includes("429")||m.includes("rate_limit"))return"⚠️ เครดิตหมด หรือถึง rate limit";
  if(m.includes("404")||m.includes("not_found")||m.includes("model:"))return"⚠️ ชื่อโมเดลไม่ถูกต้อง: "+m.slice(0,120);
  if(m.includes("529")||m.includes("overloaded"))return"⚠️ เซิร์ฟเวอร์ AI โหลดหนัก ลองใหม่อีกครั้ง";
  if(m.includes("400"))return"⚠️ คำขอผิดพลาด: "+m.slice(0,140);
  return"⚠️ "+m.slice(0,150);
}

function getInsights(scope){
  // scope: "home" | "food" | "workout"
  const p=LS.get(K.profile,null);if(!p)return[];
  const d=state.date,ins=[];
  const base=computeTargets(p,latestBody());
  const dt=dayTarget(d,base);
  const food=LS.get(K.food(d),[]);
  const eaten=food.reduce((a,f)=>a+f.cal,0);
  const protein=food.reduce((a,f)=>a+(f.protein||0),0);
  const cardio=LS.get(K.cardio(d),[]);
  const burn=cardio.reduce((a,c)=>a+(c.calories||0),0);
  const net=eaten-burn;
  const lb=latestBodyMerged();
  const bmr=lb?.bmr||base.bmr;

  if(scope==="home"||scope==="food"){
    // Deficit สูงเกิน (กินสุทธิต่ำกว่า BMR มาก)
    if(eaten>0&&net<bmr-100&&net>0){
      ins.push({t:"warn",ic:"🔥",title:"Deficit สูงเกินไป",msg:`กินสุทธิ ${net} kcal ต่ำกว่า BMR (${bmr}) — เสี่ยงสูญกล้ามเนื้อ ควรกินเพิ่ม`});
    }
    // เกินเป้า
    else if(eaten>dt.cal+50){
      ins.push({t:"amber",ic:"⚠️",title:"เกินเป้าแคลอรี่",msg:`วันนี้กิน ${eaten}/${dt.cal} kcal — ลองลดมื้อถัดไป หรือเพิ่มคาร์ดิโอ`});
    }
    // อยู่ใน deficit ที่ดี
    else if(eaten>0&&net>=bmr-100&&net<=dt.cal){
      ins.push({t:"green",ic:"✅",title:"Deficit กำลังดี",msg:`สุทธิ ${net} kcal อยู่ในโซนลดไขมันที่ปลอดภัย รักษาไว้!`});
    }
    // โปรตีนขาด (ถ้ากินไปแล้วเกินครึ่งเป้าแคล แต่โปรตีนยังต่ำ)
    if(eaten>dt.cal*0.4&&protein<base.protein*0.5){
      ins.push({t:"accent",ic:"🥩",title:"โปรตีนยังขาด",msg:`ได้ ${protein}/${base.protein}g — เพิ่มไก่/ไข่/เวย์ในมื้อถัดไปเพื่อรักษากล้ามเนื้อ`});
    }
    // น้ำน้อย
    const water=LS.get(K.water(d),0);
    if(isToday(d)&&new Date().getHours()>=18&&water<6){
      ins.push({t:"blue",ic:"💧",title:"ดื่มน้ำน้อยไป",msg:`วันนี้ ${water}/8 แก้ว — ดื่มเพิ่มอีก ${8-water} แก้วก่อนนอน`});
    }
  }

  if(scope==="food"){
    const sugar=food.reduce((a,f)=>a+(f.sugar||0),0);
    const sodium=food.reduce((a,f)=>a+(f.sodium||0),0);
    const fiber=food.reduce((a,f)=>a+(f.fiber||0),0);
    if(sugar>50)ins.push({t:"warn",ic:"🍬",title:"น้ำตาลเกินเกณฑ์",msg:`วันนี้ ${sugar}g (แนะนำ <50g) — ระวังของหวาน/เครื่องดื่ม`});
    if(sodium>2000)ins.push({t:"warn",ic:"🧂",title:"โซเดียมสูง",msg:`${sodium}mg (แนะนำ <2000mg) — ลดอาหารเค็ม/แปรรูป`});
    if(eaten>dt.cal*0.5&&fiber<15)ins.push({t:"green",ic:"🌾",title:"ไฟเบอร์ยังน้อย",msg:`ได้ ${fiber}g — เพิ่มผัก ผลไม้ ธัญพืชเต็มเมล็ด`});
  }

  if(scope==="workout"){
    // ไม่มีคาร์ดิโอหลายวัน
    let noCardioDays=0;
    for(let i=0;i<5;i++){const dd=addDays(d,-i);if((LS.get(K.cardio(dd),[])).length)break;noCardioDays++;}
    if(noCardioDays>=3)ins.push({t:"amber",ic:"🏃",title:`ไม่มีคาร์ดิโอ ${noCardioDays} วัน`,msg:"เพิ่ม Zone 2 สัก 30-45 นาที ช่วยเผาไขมันและหัวใจแข็งแรง"});
    // ออกกำลังทุกวันไม่พัก
    let streak=0;
    for(let i=0;i<8;i++){const dd=addDays(d,-i);if((LS.get(K.workout(dd),[])).length||(LS.get(K.cardio(dd),[])).length)streak++;else break;}
    if(streak>=7)ins.push({t:"amber",ic:"😴",title:`ออกกำลัง ${streak} วันติด`,msg:"ควรมีวันพักบ้าง ให้กล้ามเนื้อฟื้นตัว เลี่ยง overtraining"});
    else if(streak>=3)ins.push({t:"green",ic:"🔥",title:`Streak ${streak} วัน!`,msg:"ความสม่ำเสมอเยี่ยมมาก ทำต่อไป!"});
  }

  return ins;
}

/* ══ ENGINE ANALYSIS CARD — แสดงผลจาก Decision Engine + Energy Audit ══ */
/* ══ ADAPTIVE TDEE CARD — โชว์ให้เห็นเสมอ + ผู้ใช้ยืนยันเอง ══ */
/* ══════════════════════════════════════
   ENERGY BANK — รวม Confidence + ความสม่ำเสมอ + สุขภาพเทรนด์ เป็นคะแนนเดียว 0-100
   แนวคิดจาก Bevel แต่ไม่พึ่ง wearable — ใช้ข้อมูลที่ Engine คำนวณอยู่แล้วทั้งหมด
══════════════════════════════════════ */
function computeEnergyBank(date){
  // 1) คุณภาพข้อมูลวันนี้ (confidence)
  const conf=dayConfidence(date);
  const dataQuality=conf??50;

  // 2) ความสม่ำเสมอ — % วันที่บันทึกอาหารใน 7 วันล่าสุด
  let loggedDays=0;
  for(let i=0;i<7;i++){if((LS.get(K.food(addDays(date,-i)),[])).length)loggedDays++;}
  const consistency=Math.round(loggedDays/7*100);

  // 3) สุขภาพเทรนด์ — เทรนด์กับ Energy Audit สอดคล้องกันไหม
  const audit=energyAudit(date,7);
  let trendHealth=50,trendNote="ข้อมูลยังไม่พอประเมิน";
  if(audit){
    if(audit.status==="ok"){trendHealth=100;trendNote="แนวโน้มตรงกับที่คำนวณไว้";}
    else if(audit.status==="mismatch-lowconf"){trendHealth=60;trendNote="มีความคลาดเคลื่อน แต่ข้อมูลยังไม่แน่นพอสรุป";}
    else if(audit.status==="mismatch"){trendHealth=40;trendNote="แนวโน้มไม่ตรงกับที่คำนวณไว้ ควรเช็คการบันทึก";}
    else{trendHealth=50;trendNote="ข้อมูลยังไม่พอประเมิน";}
  }

  const score=Math.round(dataQuality*0.4+consistency*0.3+trendHealth*0.3);
  const verdict=score>=75?"ดีมาก":score>=55?"ปกติ":score>=35?"ควรปรับปรุง":"ข้อมูลไม่น่าเชื่อถือ";
  const color=score>=75?"var(--green)":score>=55?"var(--teal)":score>=35?"var(--amber)":"var(--red)";
  return{score,dataQuality,consistency,trendHealth,trendNote,verdict,color,loggedDays};
}

function tdeeCard(){
  const d=state.date;
  const r=computeAdaptiveTdee(d);
  if(!r)return"";
  const adj=getTdeeAdj();
  const dow=new Date(d+"T00:00:00").getDay();
  const isMonday=dow===1;

  // ปิดใช้งานอยู่
  if(!adj.enabled){
    return`<div class="card">
      <div style="display:flex;align-items:center;gap:11px">
        <div class="icf icf-blue" style="width:34px;height:34px">📊</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:800;color:var(--text)">Adaptive TDEE (ปิดอยู่)</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">ใช้ค่าจากสูตรมาตรฐาน ${r.formulaTdee} kcal</div>
        </div>
        <button id="tdee-enable" class="btn btn-ghost" style="width:auto;padding:6px 13px;font-size:11px">เปิดใช้</button>
      </div>
    </div>`;
  }

  // ข้อมูลยังไม่พอ
  if(r.status!=="ok"){
    const msg={
      "insufficient-days":`บันทึกอาหาร ${r.days}/${r.need} วัน — ต้องครบก่อนถึงจะเรียนรู้ TDEE จริงได้`,
      "low-confidence":`ความแม่นยำข้อมูล ${r.conf}% (ต้อง ≥${r.need}%) — ยังเรียนรู้ไม่ได้ ต้องบันทึกให้แม่นกว่านี้`,
      "insufficient-weight":"ข้อมูลน้ำหนักยังไม่พอ — ต้องชั่งอย่างน้อย 4 ครั้งใน 2 ช่วงสัปดาห์"
    }[r.status]||"ข้อมูลยังไม่พอ";
    return`<div class="card">
      <div style="display:flex;align-items:flex-start;gap:11px">
        <div class="icf icf-accent" style="width:34px;height:34px">📊</div>
        <div style="flex:1;min-width:0">
          <div class="lbl" style="margin-bottom:3px;color:var(--accent2)">ADAPTIVE TDEE</div>
          <div style="font-size:13px;font-weight:800;color:var(--text)">กำลังรอข้อมูล</div>
          <div style="font-size:12px;color:var(--text2);line-height:1.5;margin-top:2px">${esc(msg)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:6px">ตอนนี้ใช้ค่าสูตร ${r.formulaTdee} kcal${adj.delta?` (ปรับแล้ว ${adj.delta>0?"+":""}${adj.delta})`:""}</div>
        </div>
      </div>
    </div>`;
  }

  const dir=r.step>0?"เพิ่ม":"ลด";
  const changed=r.pendingChange;
  return`<div class="card" style="border-left:3px solid var(--blue)">
    <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:11px">
      <div class="icf icf-blue" style="width:34px;height:34px">📊</div>
      <div style="flex:1;min-width:0">
        <div class="lbl" style="margin-bottom:3px;color:var(--blue)">ADAPTIVE TDEE · เรียนรู้จากผลจริง</div>
        <div style="font-size:13px;font-weight:800;color:var(--text)">TDEE จริงของคุณ ≈ ${r.impliedTdee} kcal</div>
        <div style="font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:3px">
          จากที่กินเฉลี่ย ${r.intake.avg} kcal/วัน แล้วน้ำหนัก${r.trend.perWeek<0?"ลด":r.trend.perWeek>0?"เพิ่ม":"นิ่ง"} ${Math.abs(r.trend.perWeek)} kg/สัปดาห์
          ${r.wasClamped?`<br><span style="color:var(--amber)">⚠️ ค่าที่คำนวณได้เกินกรอบ ±20% จึงจำกัดไว้ที่ ${r.clamped} (อาจเป็นเพราะบันทึกคลาดเคลื่อน)</span>`:""}
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:${changed?"11px":"0"}">
      <div style="flex:1;background:var(--bg3);border-radius:var(--r-md);padding:9px;text-align:center">
        <div style="font-size:15px;font-weight:800;color:var(--text3)">${r.formulaTdee}</div>
        <div style="font-size:9px;color:var(--text3)">สูตรมาตรฐาน</div></div>
      <div style="flex:1;background:var(--blue-bg);border-radius:var(--r-md);padding:9px;text-align:center">
        <div style="font-size:15px;font-weight:800;color:var(--blue)">${r.currentTdee}</div>
        <div style="font-size:9px;color:var(--text3)">ใช้อยู่ตอนนี้</div></div>
      ${changed?`<div style="flex:1;background:var(--green-bg);border-radius:var(--r-md);padding:9px;text-align:center">
        <div style="font-size:15px;font-weight:800;color:var(--green)">${r.newTdee}</div>
        <div style="font-size:9px;color:var(--text3)">แนะนำใหม่</div></div>`:""}
    </div>
    ${changed?`
      <div class="small" style="margin-bottom:9px">${isMonday?"📅 วันจันทร์ — วันปรับประจำสัปดาห์":"ปกติปรับทุกวันจันทร์ แต่ยืนยันตอนนี้ได้ถ้าต้องการ"} · ขยับทีละไม่เกิน ${TDEE_ADJ.MAX_STEP} kcal</div>
      <button class="btn-save" id="tdee-apply">✅ ยืนยัน${dir} ${Math.abs(r.step)} kcal (เป็น ${r.newTdee})</button>
    `:`<div class="small" style="margin-top:9px">✅ TDEE ที่ใช้อยู่ตรงกับผลจริงแล้ว ไม่ต้องปรับ</div>`}
    <div style="display:flex;gap:8px;margin-top:8px">
      ${adj.delta?`<button class="btn btn-ghost" id="tdee-reset" style="flex:1;font-size:11px;padding:7px">↩️ กลับค่าสูตร</button>`:""}
      <button class="btn btn-ghost" id="tdee-disable" style="flex:1;font-size:11px;padding:7px">ปิดระบบนี้</button>
    </div>
  </div>`;
}

function engineCard(){
  const d=state.date;
  const dec=calorieDecision(d);
  if(!dec)return"";
  const audit=energyAudit(d,7);
  const conf=dayConfidence(d);
  const cl=confLabel(conf);
  const amap={decrease:"amber",increase:"blue",hold:"green","improve-data":"red",wait:"accent"};
  const c=amap[dec.action]||"accent";
  const atitle={decrease:"ควรลดแคลอรี่",increase:"ควรเพิ่มแคลอรี่",hold:"รักษาแผนเดิม","improve-data":"ข้อมูลยังไม่แม่นพอ",wait:"ข้อมูลยังไม่พอ"}[dec.action];

  // ── Weekly Check-in: คำแนะนำ "hold/decrease" ปกติ โชว์เต็มเฉพาะวันจันทร์
  //    ส่วนเรื่องความปลอดภัย (ลดเร็วเกิน/ข้อมูลไม่พอ/mismatch) โชว์ทุกวันเสมอ ──
  const dow=new Date(d+"T00:00:00").getDay(); // 0=อา 1=จ
  const isMonday=dow===1;
  const isRoutine=(dec.action==="hold"||dec.action==="decrease")&&!dec.override;
  const auditMismatch=audit&&audit.status?.startsWith("mismatch");
  if(isRoutine&&!isMonday&&!auditMismatch){
    let daysToMon=(1-dow+7)%7;if(daysToMon===0)daysToMon=7;
    return`<div class="card" style="border-left:3px solid var(--border)">
      <div style="display:flex;gap:11px;align-items:center">
        <div class="icf icf-accent" style="width:34px;height:34px">📅</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:800;color:var(--text)">บันทึกข้อมูลแล้ว ✅</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">Engine สรุปคำแนะนำเต็มทุกวันจันทร์ (อีก ${daysToMon} วัน) — กันปรับแผนตามอารมณ์จากความผันผวนรายวัน</div>
        </div>
      </div>
      ${conf!=null?`<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-top:10px">
        <span>${cl.ic}</span><span>ความแม่นยำข้อมูลวันนี้ <b style="color:${cl.color}">${conf}%</b></span>
      </div>`:""}
    </div>`;
  }

  let auditHTML="";
  if(audit&&audit.status!=="insufficient"&&audit.status!=="no-weight"){
    const mm=audit.status.startsWith("mismatch");
    auditHTML=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="lbl" style="margin-bottom:8px">⚡ Energy Audit · 7 วัน</div>
      <div style="display:flex;gap:8px;margin-bottom:${mm?"10px":"0"}">
        <div style="flex:1;background:var(--bg3);border-radius:var(--r-md);padding:9px;text-align:center">
          <div style="font-size:14px;font-weight:800;color:var(--text)">${audit.dailyDeficit>0?"−":"+"}${Math.abs(audit.dailyDeficit)}</div>
          <div style="font-size:9px;color:var(--text3)">deficit/วัน</div></div>
        <div style="flex:1;background:var(--bg3);border-radius:var(--r-md);padding:9px;text-align:center">
          <div style="font-size:14px;font-weight:800;color:var(--text2)">${audit.expectedKg>0?"+":""}${audit.expectedKg}</div>
          <div style="font-size:9px;color:var(--text3)">คาดว่าลด kg</div></div>
        <div style="flex:1;background:var(--bg3);border-radius:var(--r-md);padding:9px;text-align:center">
          <div style="font-size:14px;font-weight:800;color:${mm?"var(--amber)":"var(--green)"}">${audit.actualKg>0?"+":""}${audit.actualKg}</div>
          <div style="font-size:9px;color:var(--text3)">จริง kg</div></div>
      </div>
      ${mm?`<div class="warn" style="font-size:11px">⚠️ ต่างจากที่คาด ${Math.abs(audit.mismatch)} kg — ${audit.status==="mismatch-lowconf"?"แต่ข้อมูลยังไม่แม่นพอสรุป":"เช็ค: บันทึกอาหารครบไหม / โซเดียมสูง / น้ำในร่างกาย"}</div>`:""}
    </div>`;
  }

  const ovNow=getOverride(d);
  const ovHTML=ovNow?`<div style="display:flex;align-items:center;gap:9px;background:var(--amber-bg);border:1px solid rgba(255,180,67,.25);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px">
    <span style="font-size:17px">⚡</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:800;color:var(--amber)">เป้าเฉพาะกิจ ${ovNow.delta>0?"+":""}${ovNow.delta} kcal</div>
      <div style="font-size:10px;color:var(--text3)">${ovNow.reason?esc(ovNow.reason)+" · ":""}เหลืออีก ${daysLeftOverride(d,ovNow)} วัน (ถึง ${ovNow.until.slice(5)})</div>
    </div>
    <button id="ov-cancel" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:10px;color:var(--text2);cursor:pointer;flex-shrink:0">ยกเลิก</button>
  </div>`:"";

  return`<div class="card" style="border-left:3px solid var(--${c})">
    ${ovHTML}
    <div style="display:flex;gap:11px;align-items:flex-start;margin-bottom:${dec.action==="wait"?"0":"10px"}">
      <div class="icf icf-${c}" style="width:34px;height:34px">${dec.icon}</div>
      <div style="flex:1;min-width:0">
        <div class="lbl" style="margin-bottom:3px;color:var(--${c})">${isMonday&&isRoutine?"📅 สรุปประจำสัปดาห์ (ทุกวันจันทร์)":"ENGINE · วิเคราะห์ 14 วัน"}</div>
        <div style="font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px">${atitle}</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5">${esc(dec.reason)}</div>
        ${dec.newTarget?`<div style="margin-top:8px;display:inline-block;background:var(--${c}-bg);color:var(--${c});font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px">เป้าใหม่ ${dec.newTarget} kcal/วัน</div>`:""}
      </div>
    </div>
    ${conf!=null?`<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-top:8px">
      <span>${cl.ic}</span><span>ความแม่นยำข้อมูลวันนี้ <b style="color:${cl.color}">${conf}%</b> · ${cl.txt}</span>
    </div>`:""}
    ${auditHTML}
  </div>`;
}

function insightCard(scope){
  const ins=getInsights(scope);
  if(!ins.length)return"";
  const cmap={warn:"red",amber:"amber",green:"green",accent:"accent",blue:"blue"};
  return ins.map(x=>{
    const c=cmap[x.t]||"accent";
    return`<div class="card" style="border-left:3px solid var(--${c==="red"?"red":c})">
      <div style="display:flex;gap:11px;align-items:flex-start">
        <div class="icf icf-${c}" style="width:34px;height:34px">${x.ic}</div>
        <div style="flex:1;min-width:0">
          <div class="lbl" style="margin-bottom:3px;color:var(--${c==="red"?"red":c})">INSIGHT</div>
          <div style="font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px">${esc(x.title)}</div>
          <div style="font-size:12px;color:var(--text2);line-height:1.5">${esc(x.msg)}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* SVG silhouette ที่เปลี่ยนรูปร่าง/สีตามน้ำหนัก + %ไขมัน */
function bodyAvatarSVG(weight,bf,bmi,gender){
  // ความกว้างลำตัว: ยิ่งไขมัน/BMI สูง ยิ่งกว้าง
  let fatLevel;
  if(bf!=null){
    fatLevel=gender==="female"
      ? Math.max(0,Math.min(1,(bf-18)/22))   // หญิง 18-40%
      : Math.max(0,Math.min(1,(bf-8)/22));    // ชาย 8-30%
  }else{
    fatLevel=Math.max(0,Math.min(1,(bmi-19)/13)); // 19-32 BMI
  }
  // สี gradient: เขียว(ฟิต) → เหลือง → ส้ม → แดง
  const hue=120-fatLevel*120; // 120=เขียว, 0=แดง
  const c1=`hsl(${hue},70%,55%)`;
  const c2=`hsl(${hue},65%,42%)`;
  // ปรับความกว้างของลำตัว/เอว
  const torsoW=44+fatLevel*26;      // 44-70
  const waistW=34+fatLevel*34;      // 34-68 (เอวขยายเยอะสุด)
  const cx=110;
  return`<svg viewBox="0 0 220 280" width="150" height="190" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto">
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g fill="url(#bodyGrad)" filter="url(#glow)">
      <circle cx="${cx}" cy="38" r="22"/>
      <rect x="${cx-9}" y="56" width="18" height="14" rx="4"/>
      <path d="M ${cx-torsoW/2} 70
               Q ${cx-torsoW/2-8} 95 ${cx-waistW/2} 150
               Q ${cx-waistW/2+4} 178 ${cx-26} 190
               L ${cx+26} 190
               Q ${cx+waistW/2-4} 178 ${cx+waistW/2} 150
               Q ${cx+torsoW/2+8} 95 ${cx+torsoW/2} 70
               Q ${cx} 62 ${cx-torsoW/2} 70 Z"/>
      <path d="M ${cx-torsoW/2+4} 74 Q ${cx-torsoW/2-22} 110 ${cx-torsoW/2-14} 158 L ${cx-torsoW/2-2} 156 Q ${cx-torsoW/2-6} 112 ${cx-torsoW/2+14} 82 Z"/>
      <path d="M ${cx+torsoW/2-4} 74 Q ${cx+torsoW/2+22} 110 ${cx+torsoW/2+14} 158 L ${cx+torsoW/2+2} 156 Q ${cx+torsoW/2+6} 112 ${cx+torsoW/2-14} 82 Z"/>
      <path d="M ${cx-26} 190 L ${cx-30} 268 L ${cx-14} 268 L ${cx-6} 196 Z"/>
      <path d="M ${cx+26} 190 L ${cx+30} 268 L ${cx+14} 268 L ${cx+6} 196 Z"/>
    </g>
  </svg>`;
}

function bodyStatus(bf,bmi,gender){
  // ประเมินจาก BF% ก่อน ถ้าไม่มีใช้ BMI
  let cat,color,icon;
  if(bf!=null){
    if(gender==="female"){
      if(bf<14){cat="ต่ำกว่าเกณฑ์";color="var(--teal)";icon="⚠️";}
      else if(bf<22){cat="ฟิตมาก (Athletic)";color="var(--green)";icon="🏆";}
      else if(bf<29){cat="ฟิตดี (Fitness)";color="var(--green)";icon="✅";}
      else if(bf<35){cat="ปกติ (Average)";color="var(--amber)";icon="🔸";}
      else{cat="ควรลดไขมัน (Obese)";color="var(--red)";icon="🔴";}
    }else{
      if(bf<6){cat="ต่ำกว่าเกณฑ์";color="var(--teal)";icon="⚠️";}
      else if(bf<14){cat="ฟิตมาก (Athletic)";color="var(--green)";icon="🏆";}
      else if(bf<18){cat="ฟิตดี (Fitness)";color="var(--green)";icon="✅";}
      else if(bf<25){cat="ปกติ (Average)";color="var(--amber)";icon="🔸";}
      else{cat="ควรลดไขมัน (Obese)";color="var(--red)";icon="🔴";}
    }
  }else if(bmi!=null){
    if(bmi<18.5){cat="ผอมเกิน (Underweight)";color="var(--teal)";icon="⚠️";}
    else if(bmi<23){cat="รูปร่างดี (Normal)";color="var(--green)";icon="✅";}
    else if(bmi<25){cat="ท้วม (Overweight)";color="var(--amber)";icon="🔸";}
    else if(bmi<30){cat="น้ำหนักเกิน (Obese I)";color="var(--red)";icon="🔴";}
    else{cat="อ้วนมาก (Obese II)";color="var(--red)";icon="🔴";}
  }else{cat="รอข้อมูลร่างกาย";color="var(--text3)";icon="📊";}
  return`<div style="display:inline-flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:7px 16px">
    <span style="font-size:15px">${icon}</span>
    <span style="font-size:13px;font-weight:700;color:${color}">${cat}</span>
  </div>`;
}

  // ── Journal — บันทึกปัจจัยเชิงคุณภาพ (ช่วยอธิบายน้ำหนักแกว่ง) ──

    const sc=items.reduce((a,f)=>a+(f.carb||0),0);

    const pct=v=>totCal>0?Math.round(v/totCal*100):0;
    h+=`<div class="mealcard"><div class="mealhead">

        <span style="font-size:11px;color:var(--text2)">🥑 ไขมัน <b style="color:var(--amber)">${sf}g</b> <span style="color:var(--text3)">(${pct(fCal)}%)</span></span>
      </div>
      <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bg3)">
        <div style="width:${pct(pCal)}%;background:var(--accent)"></div>
        <div style="width:${pct(cCal)}%;background:var(--teal)"></div>
        <div style="width:${pct(fCal)}%;background:var(--amber)"></div>
      </div>

    ${!items.length?`<div class="empty">ยังว่างอยู่</div>`:items.map(f=>`
      <div class="foodrow">
        <div style="flex:1">
          <div class="fn">${esc(f.name)}</div>
          <div class="meta">${f.time||""} · ป${f.protein} ค${f.carb} ม${f.fat}g</div>
        </div>
        <div class="fcal num">${f.cal}</div>
        <button class="delbtn" data-del="${f.id}">×</button>
      </div>`).join("")}
    </div>`;
  });
  return h;
}

function macro(label,v,t,c){
  const pct=Math.min(100,v/(t||1)*100);
  return`<div class="macro">
    <div class="top"><span class="ml">${label}</span><span class="mv num">${v}/${t}g</span></div>
    <div class="mt"><div class="mf" style="width:${pct}%;background:${c}"></div></div>
  </div>`;
}
/* วงแหวน macro แบบ Soom (SVG ring) */
/* วงแหวนแคลอรี่ใหญ่ (hero ring) — สไตล์ dashboard */
function calorieRing(eaten,target,{size=132,stroke=13}={}){
  const pct=Math.min(1.15,target?eaten/target:0);
  const r=(size-stroke)/2,cx=size/2,cir=2*Math.PI*r;
  const off=cir*(1-Math.min(1,pct));
  const over=eaten>target;
  const c1=over?"#FF6B6B":pct>0.85?"#FFB443":"#3DDC97";
  const c2=over?"#FF9E7E":pct>0.85?"#FFD08A":"#2FD9E8";
  const gid="cr"+Math.random().toString(36).slice(2,7);
  const remain=target-eaten;
  return`<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);display:block">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
        </linearGradient>
        <filter id="${gid}g"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${cir}" stroke-dashoffset="${off}"
        filter="url(#${gid}g)" style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:9.5px;color:var(--text3);font-weight:700;letter-spacing:.5px">แคลอรี่</div>
      <div style="font-size:${size>120?"30":"24"}px;font-weight:900;color:var(--text);line-height:1.05">${eaten}</div>
      <div style="font-size:10.5px;color:var(--text3);font-weight:600">/ ${target}</div>
      <div style="font-size:9.5px;font-weight:800;color:${remain>=0?"var(--green)":"var(--red)"};margin-top:2px">${remain>=0?`เหลือ ${remain}`:`เกิน ${Math.abs(remain)}`}</div>
    </div>
  </div>`;
}

function macroRing(label,v,t,color){
  const pct=Math.min(1,v/(t||1));
  const r=24,cir=2*Math.PI*r,off=cir*(1-pct);
  return`<div style="flex:1;text-align:center">
    <div style="position:relative;width:62px;height:62px;margin:0 auto">
      <svg width="62" height="62" viewBox="0 0 62 62" style="transform:rotate(-90deg)">
        <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="6"/>
        <circle cx="31" cy="31" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${cir}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .5s"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text)">${Math.round(pct*100)}<span style="font-size:9px">%</span></div>
    </div>
    <div style="margin-top:5px;font-size:10px;color:var(--text3);font-weight:600">${label}</div>
    <div style="font-size:10.5px;font-weight:700;color:${color}">${v}/${t}g</div>
  </div>`;
}

  if(state.tab==="home"){
    const gf=document.getElementById("go-food");if(gf)gf.onclick=()=>{state.tab="food";render();};

    const gw=document.getElementById("go-workout");if(gw)gw.onclick=()=>{state.tab="workout";render();};
    const gb=document.getElementById("go-body");if(gb)gb.onclick=()=>{state.tab="body";render();setTimeout(()=>{const s=document.getElementById("scan");if(s)s.click();},100);};
    const gb2=document.getElementById("go-body2");if(gb2)gb2.onclick=()=>{state.tab="body";render();};
    const tA=document.getElementById("tdee-apply");
    if(tA)tA.onclick=()=>{
      const r=applyTdeeAdj(state.date);

    };

    if(tE)tE.onclick=()=>{setTdeeAdjEnabled(true);render();toast("📊 เปิด Adaptive TDEE แล้ว");};
    const tD=document.getElementById("tdee-disable");
    if(tD)tD.onclick=()=>{if(confirm("ปิด Adaptive TDEE? จะกลับไปใช้ค่าจากสูตรมาตรฐาน")){setTdeeAdjEnabled(false);render();toast("ปิด Adaptive TDEE แล้ว");}};
    const tR=document.getElementById("tdee-reset");
    if(tR)tR.onclick=()=>{if(confirm("รีเซ็ตกลับค่าสูตรมาตรฐาน? ประวัติการเรียนรู้จะถูกลบ")){resetTdeeAdj();render();toast("↩️ กลับไปใช้ค่าสูตรแล้ว");}};
    const ovc=document.getElementById("ov-cancel");
    if(ovc)ovc.onclick=()=>{if(confirm("ยกเลิกเป้าเฉพาะกิจ กลับไปใช้เป้าปกติ?")){clearOverride();render();toast("↩️ กลับสู่เป้าปกติแล้ว");}};
    const gc=document.getElementById("go-coach");if(gc)gc.onclick=openCoach;
  }
  if(state.tab==="food"){
    const af=document.getElementById("analyze-food");if(af)af.onclick=openFoodAnalysis;
    document.querySelectorAll("[data-jtag]").forEach(b=>b.onclick=()=>{toggleJournalTag(state.date,b.dataset.jtag);render();});
    const jn=document.getElementById("journal-note");
    if(jn)jn.onblur=()=>setJournalNote(state.date,jn.value);
    document.querySelectorAll(".addbtn[data-meal]").forEach(b=>b.onclick=()=>openAddFood(b.dataset.meal));
    document.querySelectorAll("[data-savetpl]").forEach(b=>b.onclick=()=>{
      const mid=b.dataset.savetpl;
      const items=LS.get(K.food(state.date),[]).filter(f=>f.meal===mid);
      if(!items.length)return;
      const mlabel=MEALS.find(m=>m.id===mid)?.label||"";
      const def=items.length===1?items[0].name:`${mlabel} ${items.length} อย่าง`;
      const name=prompt(`ตั้งชื่อมื้อนี้ไว้ใช้ซ้ำ (${items.length} รายการ, ${items.reduce((a,f)=>a+f.cal,0)} kcal)`,def);
      if(!name||!name.trim())return;
      saveMealTemplate(name.trim(),items);
      toast(`🍱 บันทึก "${name.trim()}" แล้ว — เรียกใช้ได้จากปุ่ม + เพิ่ม`);
    });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      const food=LS.get(K.food(state.date),[]).filter(f=>String(f.id)!==b.dataset.del);
      LS.set(K.food(state.date),food);render();
    });
    const wp=document.getElementById("water-plus");if(wp)wp.onclick=()=>{const w=LS.get(K.water(state.date),0);LS.set(K.water(state.date),Math.min(20,w+1));render();};
    const wm=document.getElementById("water-minus");if(wm)wm.onclick=()=>{const w=LS.get(K.water(state.date),0);LS.set(K.water(state.date),Math.max(0,w-1));render();};
    // ── Fasting handlers ──
    const FH={"16:8":16,"18:6":18,"20:4":20,"OMAD":23};
    document.querySelectorAll("#fast-mode button").forEach(b=>b.onclick=()=>{
      const f=LS.get(K.fast,{mode:"16:8",startedAt:null,streak:0,done:0,total:0,lastDone:null});
      f.mode=b.dataset.fm;LS.set(K.fast,f);render();
    });
    const fs=document.getElementById("fast-start");
    if(fs)fs.onclick=()=>{
      const f=LS.get(K.fast,{mode:"16:8",startedAt:null,streak:0,done:0,total:0,lastDone:null});
      f.startedAt=Date.now();LS.set(K.fast,f);render();toast("⏳ เริ่ม Fasting แล้ว สู้ๆ!");
    };
    const fe=document.getElementById("fast-end");
    if(fe)fe.onclick=()=>{
      const f=LS.get(K.fast,{mode:"16:8",startedAt:null,streak:0,done:0,total:0,lastDone:null});
      if(!f.startedAt)return;
      const target=FH[f.mode||"16:8"]*3600000;
      const success=(Date.now()-f.startedAt)>=target;
      if(!success&&!confirm("ยังไม่ครบเวลา จบตอนนี้จะไม่นับสำเร็จและ streak รีเซ็ต — จบเลยไหม?"))return;
      f.total=(f.total||0)+1;
      if(success){
        f.done=(f.done||0)+1;
        const today=todayStr(),yest=addDays(today,-1);
        f.streak=(f.lastDone===yest||f.lastDone===today)?(f.streak||0)+1:1;
        f.lastDone=today;
      }else{f.streak=0;}
      f.startedAt=null;LS.set(K.fast,f);render();
      toast(success?"🎉 Fasting สำเร็จ! Streak "+f.streak:"จบ Fasting แล้ว ครั้งหน้าเอาใหม่");
    };
    // live timer tick (อัพเดททุก 30 วิ เฉพาะตอนกำลังอด)
    if(window._fastTick)clearInterval(window._fastTick);
    const fObj=LS.get(K.fast,null);
    if(fObj&&fObj.startedAt&&document.getElementById("fast-timer")){
      window._fastTick=setInterval(()=>{
        const el=document.getElementById("fast-timer");
        if(!el){clearInterval(window._fastTick);return;}
        const e2=Date.now()-fObj.startedAt;
        el.textContent=Math.floor(e2/3600000)+":"+String(Math.floor(e2%3600000/60000)).padStart(2,"0");
      },30000);
    }
  }
  if(state.tab==="body")bindBody();
  if(state.tab==="workout")bindWorkout();
  if(state.tab==="more")bindMore();
}

function recentFoods(){
  // ใช้ฐานข้อมูลส่วนตัวถาวร (ไม่จำกัด 30 วันเหมือนเดิม) เรียงตามใช้บ่อย
