/* ══ NUTRITION SANITY CHECK — ตรวจสอบด้วยโค้ด ไม่เชื่อ AI อย่างเดียว ══ */
/* ══════════════════════════════════════
   PERSONAL FOOD DATABASE — สะสมจากผลที่ AI วิเคราะห์แล้ว
   จับคู่ชื่อแบบเป๊ะเท่านั้น (ปลอดภัยกว่า fuzzy match) — ไม่ auto-apply ให้ผู้ใช้เลือกยืนยันเอง
══════════════════════════════════════ */
function normFoodName(name){
  return String(name||"").trim().toLowerCase().replace(/\s+/g," ");
}
function getFoodDB(){return LS.get(K.foodDB,{});}
/* บันทึก/อัพเดทรายการอาหารลงฐานข้อมูลส่วนตัว หลัง AI วิเคราะห์สำเร็จ */
function saveToFoodDB(item){
  if(!item?.name||!item?.cal)return;
  const key=normFoodName(item.name);
  if(!key)return;
  const db=getFoodDB();
  const existing=db[key];
  db[key]={
    name:item.name, // เก็บชื่อต้นฉบับไว้โชว์ (key คือ normalized)
    cal:item.cal,protein:item.protein||0,carb:item.carb||0,fat:item.fat||0,
    fiber:item.fiber||0,sugar:item.sugar||0,sodium:item.sodium||0,
    identifiedAs:item.identifiedAs||"",kcalPer100g:item.kcalPer100g||0,
    size:item.size||"",method:item.method||"",
    useCount:(existing?.useCount||0)+1,
    lastUsed:todayStr(),
    firstSaved:existing?.firstSaved||todayStr()
  };
  LS.set(K.foodDB,db);
}
/* ค้นหาแบบเป๊ะเท่านั้น — คืน null ถ้าไม่เจอ กันจับผิดตัว */
function lookupFoodDB(name){
  const key=normFoodName(name);
  if(!key)return null;
  const db=getFoodDB();
  return db[key]||null;
}
function deleteFromFoodDB(name){
  const db=getFoodDB();
  delete db[normFoodName(name)];
  LS.set(K.foodDB,db);
}
function foodDBStats(){
  const db=getFoodDB();
  const items=Object.values(db);
  return{count:items.length,totalUses:items.reduce((a,i)=>a+(i.useCount||0),0),
    topUsed:items.sort((a,b)=>(b.useCount||0)-(a.useCount||0)).slice(0,10)};
}

function nutriSanityCheck(item){
  const warns=[];
  // 1. cal ต้องสอดคล้องกับ macro (4/4/9) — จับกรณี AI คำนวณเลขไม่ตรงกันเอง
  const macroCal=(item.protein||0)*4+(item.carb||0)*4+(item.fat||0)*9;
  if(item.cal>0&&macroCal>0){
    const diff=Math.abs(item.cal-macroCal)/item.cal;
    if(diff>0.15)warns.push(`ตัวเลขไม่สอดคล้อง: ระบุ ${item.cal} kcal แต่ macro รวมได้ ${Math.round(macroCal)} kcal`);
  }
  // 2. เทียบ kcalPer100g กับค่าต่ำสุดที่เป็นไปได้ตามชนิดอาหาร — จับกรณีระบุชนิดอาหารผิด
  //    หมายเหตุ: ค่าเหล่านี้อ้างอิง "อาหารสุก" (cooked) ตามที่ผู้ใช้ชั่งจริง
  const idl=((item.identifiedAs||"")+" "+(item.name||"")).toLowerCase();
  const rawHint=/ดิบ|raw|สด(?!.*ผัก)/.test(idl); // ถ้าระบุว่าดิบ ใช้เกณฑ์ต่ำลง
  const FLOORS=[
    {re:/วัว|beef|เนื้อแดง|สเต็ก|steak|พิคาน|ปีคาน|picanha|ribeye|ริบอาย|วากิว|wagyu|สันคอ|สันนอก|สันใน.*วัว/,min:180,rawMin:120,label:"เนื้อวัว"},
    {re:/หมู|pork|สามชั้น|คอหมู|หมูสับ/,min:180,rawMin:120,label:"เนื้อหมู"},
    {re:/แซลมอน|salmon|ปลาทู|แมคเคอเรล|mackerel/,min:180,rawMin:130,label:"ปลาไขมันสูง"},
    {re:/อกไก่|chicken breast|ไก่.*ไม่ติดหนัง/,min:150,rawMin:110,label:"อกไก่"},
    {re:/เนย|butter|น้ำมัน|oil|ครีม|cream/,min:300,rawMin:300,label:"ไขมัน/น้ำมัน"},
    {re:/ทอด|fried|ชุบแป้ง/,min:200,rawMin:180,label:"ของทอด"},
    {re:/ถั่ว|nut|อัลมอนด์|almond|เม็ดมะม่วง|cashew/,min:400,rawMin:400,label:"ถั่วเปลือกแข็ง"},
  ];
  const per100=item.kcalPer100g||0;
  if(per100>0){
    for(const f of FLOORS){
      if(f.re.test(idl)){
        const floor=rawHint?f.rawMin:f.min;
        if(per100<floor)warns.push(`⚠️ ${f.label}${rawHint?"(ดิบ)":"(สุก)"} ไม่ควรต่ำกว่า ~${floor} kcal/100g แต่ระบุ ${per100} — อาจระบุชนิดอาหารผิด หรือคิดเป็นน้ำหนักดิบ`);
        break;
      }
    }
  }
  return warns;
}

/* ══ NUTRITION ACCURACY GUIDANCE — ใช้ร่วมกันทุกโหมดวิเคราะห์อาหาร ══
   เป้าหมาย: ให้แม่นเทียบเท่าถาม AI ข้างนอกแอป + ทำให้เห็นได้ว่า AI ระบุอาหารเป็นอะไร */
const NUTRI_RULES=`
กฎการวิเคราะห์ (สำคัญมาก — ต้องทำตามทุกข้อ):
1. ระบุชนิดอาหารให้ชัดเจนที่สุดก่อนคำนวณ ใส่ใน "identifiedAs" เสมอ
   - ชื่อทับศัพท์/ต่างประเทศต้องแปลงเป็นชนิดที่รู้จักให้ได้ เช่น
     พิคานย่า/ปีคานย่า = เนื้อวัวส่วนสะโพกติดชั้นไขมัน (picanha / top sirloin cap)
     ริบอาย = ribeye เนื้อวัวติดมันมาก | วากิว = เนื้อวัวไขมันแทรกสูงมาก
     ซาลมอน = ปลาแซลมอน ไขมันสูง | เอ็นข้อไก่ = กระดูกอ่อนไก่
   - ถ้าไม่แน่ใจว่าคืออะไร ให้เดาจากบริบทที่สมเหตุสมผลที่สุด แล้วตั้ง "uncertain":true
2. ใส่ "kcalPer100g" เสมอ เพื่อให้ตรวจสอบย้อนกลับได้ว่าระบุชนิดอาหารถูกไหม
3. เนื้อสัตว์ต้องนับไขมันที่ติดมากับเนื้อด้วย (fat cap / ไขมันแทรก) ไม่ใช่คิดเป็นเนื้อล้วน
   - "ไม่ใช้เนย/ไม่ใช้น้ำมัน" หมายถึงไม่เติมไขมันตอนปรุงเท่านั้น ไขมันในตัวเนื้อยังอยู่ครบ
4. **น้ำหนักที่ผู้ใช้ระบุ ให้ถือเป็นน้ำหนัก "สุก/พร้อมกิน" เสมอ** เว้นแต่บอกชัดว่าเป็นน้ำหนักดิบ
   - อาหารสุกเข้มข้นกว่าดิบ เพราะน้ำระเหยไป (เนื้อสัตว์เสียน้ำหนัก ~25-30% เมื่อปรุงสุก)
   - ตัวอย่าง: เนื้อวัวดิบ ~250 kcal/100g → เมื่อสุกจะเป็น ~350 kcal/100g
   - ดังนั้นต้องใช้ค่าอ้างอิงของ "อาหารสุก" (cooked) ไม่ใช่ค่าดิบ (raw)
   - "kcalPer100g" ที่ตอบมา ต้องเป็นค่าต่อ 100g ของอาหารในสภาพที่กินจริง (สุกแล้ว)
5. ค่าที่ตอบต้องสอดคล้องกัน: cal ≈ protein×4 + carb×4 + fat×9 (คลาดเคลื่อนได้ไม่เกิน 10%)
6. อย่าประเมินต่ำเกินจริง — ให้ใช้ค่าอ้างอิงมาตรฐาน (USDA/ตารางโภชนาการ) ตามชนิดอาหารที่ระบุ
`;

/* ══ MEAL TEMPLATES — บันทึกทั้งมื้อไว้ใช้ซ้ำ ══ */
function getMealTemplates(){return LS.get(K.mealTpl,[]);}
function saveMealTemplate(name,items){
  const tpls=getMealTemplates();
  const clean=items.map(f=>({name:f.name,cal:f.cal,protein:f.protein||0,carb:f.carb||0,fat:f.fat||0,
    fiber:f.fiber||0,sugar:f.sugar||0,sodium:f.sodium||0,conf:f.conf??CONF.MANUAL}));
  const tot=clean.reduce((a,f)=>a+f.cal,0);
  tpls.push({id:Date.now()+"t"+Math.random().toString(36).slice(2,5),name,items:clean,
    totalCal:tot,count:clean.length,createdAt:todayStr(),usedCount:0});
  LS.set(K.mealTpl,tpls);return tpls.length;
}
function deleteMealTemplate(id){LS.set(K.mealTpl,getMealTemplates().filter(t=>t.id!==id));}
function applyMealTemplate(id,meal,date){
  const t=getMealTemplates().find(x=>x.id===id);
  if(!t)return 0;
  const food=LS.get(K.food(date),[]);
  const time=new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  t.items.forEach(it=>food.push({...it,id:Date.now()+"tp"+Math.random().toString(36).slice(2,6),meal,time}));
  LS.set(K.food(date),food);
  // นับจำนวนครั้งที่ใช้ เพื่อเรียงลำดับความนิยม
  const tpls=getMealTemplates();
  const idx=tpls.findIndex(x=>x.id===id);
  if(idx>=0){tpls[idx].usedCount=(tpls[idx].usedCount||0)+1;LS.set(K.mealTpl,tpls);}
  return t.items.length;
}

  // วาดรายการ item ที่แก้ไขได้ + ช่องแจ้งแก้ + ปุ่ม re-analyze
  function renderFaItems(){
    const tot=faItems.reduce((a,i)=>({c:a.c+i.cal,p:a.p+i.protein,cb:a.cb+i.carb,ft:a.ft+i.fat}),{c:0,p:0,cb:0,ft:0});
    faTarget.innerHTML=`
      <div class="note" style="margin-bottom:12px;font-size:12px">🤖 AI เห็น ${faItems.length} รายการ — แก้ไขได้ ถ้าไม่ตรงให้พิมพ์บอกด้านล่างแล้วกด "วิเคราะห์ใหม่"</div>
      <div id="fa-items">${faItems.map((it,i)=>faItemCard(it,i)).join("")}</div>
      <button class="btn btn-ghost btn-block" id="fa-add" style="margin-bottom:12px">➕ เพิ่มรายการ</button>
      <div class="card" style="padding:13px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800">
          <span>รวมทั้งหมด</span>
          <span id="fa-sum" style="color:var(--accent2)">${tot.c} kcal</span>
        </div>
        <div id="fa-macsum" style="font-size:11px;color:var(--text3);margin-top:3px">P${tot.p}g · C${tot.cb}g · F${tot.ft}g</div>
      </div>
      <div style="margin-bottom:10px">
        <div class="flbl">💬 แจ้งแก้ไขให้ AI (ถ้าวิเคราะห์ไม่ตรง)</div>
        <textarea id="fa-correct" rows="2" placeholder="เช่น: อันที่ 2 ผิด ต้องเป็นไก่ต้ม 200g ไม่ใช่ไก่ย่าง / ขาดผักต้ม 50g" style="width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;font-family:inherit;font-size:13px;resize:vertical"></textarea>
      </div>
      <button class="btn btn-block" id="fa-reanalyze" style="margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--teal));color:#fff">🤖 วิเคราะห์ใหม่ตามที่แจ้ง</button>
      <button class="btn-save" id="fa-saveall">บันทึกทั้งหมดลงมื้อ${ml}</button>
    `;
    // bind: edit fields
    faTarget.querySelectorAll("[data-fi]").forEach(inp=>inp.oninput=()=>{
      const i=+inp.dataset.fi,k=inp.dataset.k;
      faItems[i][k]=(k==="name"||k==="size"||k==="method")?inp.value:(+inp.value||0);
      faEdited=true;
      // อัพเดทยอดรวมแบบ live เฉพาะตัวเลข
      if(k!=="name"&&k!=="size"&&k!=="method"){
        const tot=faItems.reduce((a,it)=>({c:a.c+it.cal,p:a.p+it.protein,cb:a.cb+it.carb,ft:a.ft+it.fat}),{c:0,p:0,cb:0,ft:0});
        const sumEl=faTarget.querySelector("#fa-sum");if(sumEl)sumEl.textContent=tot.c+" kcal";
        const macEl=faTarget.querySelector("#fa-macsum");if(macEl)macEl.textContent=`P${tot.p}g · C${tot.cb}g · F${tot.ft}g`;
      }
    });
    // delete item
    faTarget.querySelectorAll("[data-fidel]").forEach(b=>b.onclick=()=>{faItems.splice(+b.dataset.fidel,1);if(!faItems.length)faItems=[{name:"อาหาร",size:"",method:"",cal:0,protein:0,carb:0,fat:0}];renderFaItems();});
    // add item
    faTarget.querySelector("#fa-add").onclick=()=>{faItems.push({name:"",size:"",method:"",cal:0,protein:0,carb:0,fat:0});renderFaItems();};
    // re-analyze with correction note
    faTarget.querySelector("#fa-reanalyze").onclick=faReanalyze;
    // save all
    faTarget.querySelector("#fa-saveall").onclick=()=>{
      const valid=faItems.filter(it=>it.name.trim()&&it.cal>0);
      if(!valid.length){setErr("af-err","ไม่มีรายการที่บันทึกได้ (ต้องมีชื่อและแคลอรี่)");return;}
      const food=LS.get(K.food(state.date),[]);
      const srcConf=faSource==="barcode"?CONF.MANUAL:(faEdited?CONF.AI_EDITED:(faSource==="text"?CONF.AI_TEXT:CONF.AI_PHOTO));
      valid.forEach(it=>{
        // ลด confidence ถ้า AI ไม่มั่นใจ หรือ sanity check เจอปัญหา (ผู้ใช้แก้เองแล้วไม่ลด)
        let c=srcConf;
        if(!faEdited&&faSource!=="barcode"){
          if(it.uncertain)c-=15;
          if(nutriSanityCheck(it).length)c-=15;
        }
        food.push({id:Date.now()+"r"+Math.random().toString(36).slice(2,6),meal,name:it.name.trim(),cal:it.cal,protein:it.protein,carb:it.carb,fat:it.fat,fiber:it.fiber||0,sugar:it.sugar||0,sodium:it.sodium||0,conf:Math.max(30,c),time:new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})});
        // เก็บลงฐานข้อมูลส่วนตัว — ครั้งหน้าเจอชื่อเดียวกันเป๊ะๆ ใช้ค่านี้ได้เลย ไม่ต้องเรียก AI ซ้ำ
        saveToFoodDB({name:it.name.trim(),cal:it.cal,protein:it.protein,carb:it.carb,fat:it.fat,fiber:it.fiber,sugar:it.sugar,sodium:it.sodium,identifiedAs:it.identifiedAs,kcalPer100g:it.kcalPer100g,size:it.size,method:it.method});
      });
      LS.set(K.food(state.date),food);closeSheet();render();toast(`✅ บันทึก ${valid.length} รายการแล้ว`);
    };
  }

/* ── image picker (camera + library) ── */
/* รับได้หลายรูป + พิมพ์รายละเอียดเสริมได้ — imgState = {images:[{mime,b64}], note:""} */
function renderImgPicker(box,imgState,hint,onAnalyze){
  if(!imgState.images)imgState.images=[];
  if(imgState.note==null)imgState.note="";
  renderPicker();

  function renderPicker(){
    const n=imgState.images.length;
    box.innerHTML=`
      <div class="img-opts" id="ip-opts" style="${n?"margin-bottom:12px":""}">
        <button class="imgbtn" id="ip-cam"><span class="ic2">📷</span><span class="tx">${n?"ถ่ายเพิ่ม":"ถ่ายรูป"}</span></button>
        <button class="imgbtn" id="ip-lib"><span class="ic2">🖼️</span><span class="tx">${n?"เพิ่มจากคลัง":"เลือกจากคลัง"}</span></button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="ip-file-cam" style="display:none">
      <input type="file" accept="image/*" multiple id="ip-file-lib" style="display:none">
      ${n?`
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px">
          ${imgState.images.map((im,i)=>`
            <div style="position:relative;aspect-ratio:1">
              <img src="data:${im.mime};base64,${im.b64}" style="width:100%;height:100%;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border)">
              <button data-ip-del="${i}" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg);font-size:12px;font-weight:800;cursor:pointer;line-height:1">×</button>
            </div>`).join("")}
        </div>
        <div style="margin-bottom:12px">
          <div class="flbl">📝 รายละเอียดเพิ่มเติม (ไม่บังคับ)</div>
          <textarea id="ip-note" rows="2" placeholder="เช่น จานซ้ายไม่ใส่น้ำมัน / อีกรูปเป็นแกงเขียวหวานไก่ 1 ถ้วย" style="width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;font-family:inherit;font-size:13px;resize:vertical">${esc(imgState.note)}</textarea>
        </div>
        <button class="btn btn-primary btn-block" id="af-analyze">🤖 วิเคราะห์ด้วย AI${n>1?` (${n} รูป)`:""}</button>
      `:""}
    `;
    box.querySelector("#ip-cam").onclick=()=>box.querySelector("#ip-file-cam").click();
    box.querySelector("#ip-lib").onclick=()=>box.querySelector("#ip-file-lib").click();
    box.querySelector("#ip-file-cam").onchange=e=>handleFiles(e.target.files);
    box.querySelector("#ip-file-lib").onchange=e=>handleFiles(e.target.files);
    box.querySelectorAll("[data-ip-del]").forEach(b=>b.onclick=()=>{
      imgState.images.splice(+b.dataset.ipDel,1);renderPicker();
    });
    const noteEl=box.querySelector("#ip-note");
    if(noteEl)noteEl.oninput=()=>{imgState.note=noteEl.value;};
    const anBtn=box.querySelector("#af-analyze");
    if(anBtn)anBtn.onclick=onAnalyze;
  }

  function handleFiles(fileList){
    const files=Array.from(fileList||[]);
    if(!files.length)return;
    let pending=files.length;
    files.forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>{
        const m=ev.target.result.match(/^data:(.*?);base64,(.*)$/);
        if(m)imgState.images.push({mime:m[1],b64:m[2]});
        pending--;
        if(pending===0)renderPicker();
      };
      r.readAsDataURL(f);
    });
  }
}

      ["น้ำหนัก",latest.weight,"kg",true],

      latest.skeletalMuscle!=null?["กล้ามโครงร่าง",latest.skeletalMuscle,"kg"]:null,
      latest.bmr!=null?["BMR",latest.bmr,"kcal"]:null,

    ].filter(Boolean);
    const extraStats=[
      latest.waterPct!=null?["น้ำในร่างกาย",latest.waterPct,"%"]:null,
      latest.proteinPct!=null?["โปรตีน",latest.proteinPct,"%"]:null,
      latest.visceralFat!=null?["ไขมันช่องท้อง",latest.visceralFat,""]:null,
      latest.subcutaneousFat!=null?["ไขมันใต้ผิวหนัง",latest.subcutaneousFat,"%"]:null,
      latest.boneMass!=null?["กระดูก",latest.boneMass,"kg"]:null,
      latest.metabolicAge!=null?["อายุร่างกาย",latest.metabolicAge,"ปี"]:null,
    ].filter(Boolean);
    h+=`<div class="statrow">${mainStats.map(([l,v,u,hl])=>`<div class="stat ${hl?"hl":""}"><div class="sl">${l}</div><div class="sv num">${v}</div><div class="su">${u}</div></div>`).join("")}</div>`;
    if(extraStats.length)h+=`<div class="statrow" style="margin-top:8px">${extraStats.map(([l,v,u])=>`<div class="stat"><div class="sl">${l}</div><div class="sv num" style="font-size:16px">${v}</div><div class="su">${u}</div></div>`).join("")}</div>`;
  }
  h+=`</div>`;
  if(latest&&(p.targetWeight||p.targetBf)){
    h+=`<div class="card"><div class="lbl" style="margin-bottom:12px">ความคืบหน้าสู่เป้าหมาย</div>`;
    if(p.targetWeight)h+=goalBar("น้ำหนัก",first?.weight,latest.weight,p.targetWeight,"kg");
    if(p.targetBf&&latest.bodyFat!=null)h+=goalBar("% ไขมัน",first?.bodyFat,latest.bodyFat,p.targetBf,"%");
    if(implied)h+=`<div class="note" style="margin-top:10px">💡 ถ้ารักษากล้ามเนื้อไว้ (${Math.round(t.lean)}kg) เมื่อไขมัน ${p.targetBf}% น้ำหนักควรอยู่ที่ <b>${implied} kg</b></div>`;

  if(body.length>=2){

  }
  return h;
}

/* สรุปแนวโน้ม + อัตราต่อสัปดาห์ */
function trendSummary(data){
  if(data.length<2)return `<div class="small">ข้อมูลยังไม่พอในช่วงนี้</div>`;
  const f=data[0],l=data[data.length-1];
  const days=Math.max(1,(new Date(l.date)-new Date(f.date))/86400000);
  const weeks=days/7;
  const rows=[];
  const wChange=l.weight-f.weight;
  rows.push(["น้ำหนัก",wChange,"kg",wChange/weeks]);
  if(f.bodyFat!=null&&l.bodyFat!=null)rows.push(["ไขมัน",l.bodyFat-f.bodyFat,"%",(l.bodyFat-f.bodyFat)/weeks]);
  if(f.muscleMass!=null&&l.muscleMass!=null)rows.push(["กล้ามเนื้อ",l.muscleMass-f.muscleMass,"kg",(l.muscleMass-f.muscleMass)/weeks]);
  return`<div style="display:flex;flex-direction:column;gap:8px">
    ${rows.map(([label,chg,unit,perWeek])=>{
      const good=label==="กล้ามเนื้อ"?chg>=0:chg<=0;
      const col=Math.abs(chg)<0.05?"var(--text2)":good?"var(--green)":"var(--red)";
      const arrow=chg<0?"▼":chg>0?"▲":"–";
      return`<div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:var(--text2)">${label}</span>
        <span style="font-size:13px;font-weight:700;color:${col}">${arrow} ${Math.abs(chg).toFixed(1)}${unit} <span style="font-size:10px;color:var(--text3);font-weight:500">(${perWeek>=0?"+":""}${perWeek.toFixed(2)}${unit}/สัปดาห์)</span></span>
      </div>`;
    }).join("")}
    <div class="small" style="margin-top:2px">ช่วง ${Math.round(days)} วัน (${data.length} ครั้งที่ชั่ง)</div>
  </div>`;
}

function goalBar(label,from,now,target,unit){
  const start=from??now,total=Math.abs(start-target)||1,done=Math.abs(start-now),pct=Math.min(100,Math.round(done/total*100));
  return`<div class="goalbar">
    <div class="top"><span class="gl">${label}</span><span class="gv num">${now}${unit} → ${target}${unit}</span></div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="gpct">คืบหน้า ${pct}% (จาก ${start}${unit})</div>
  </div>`;
}

function trendCard(title,data,field,color){
  const pts=data.filter(d=>d[field]!=null);
  if(pts.length<2)return"";
  const fmtD=ds=>{const p=ds.split("-");return +p[2]+"/"+ +p[1];};
  const first=pts[0][field],last=pts[pts.length-1][field],diff=+(last-first).toFixed(1);
  const dc=diff<0?"var(--green)":diff>0?"var(--amber)":"var(--text3)";
  return`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="lbl">${title}</div>
      <div style="font-size:12px;font-weight:800;color:${dc}">${diff>0?"+":""}${diff}</div>
    </div>
    ${lineChart(pts.map(d=>({x:fmtD(d.date),y:d[field]})),{color})}
  </div>`;
}

  document.getElementById("close-sc").onclick=closeSheet;

    const nk=+document.getElementById("neck-quick").value||null;
    if(w&&(w<40||w>200)){toast("⚠️ รอบเอวควรอยู่ระหว่าง 40-200 cm");return;}
    if(hp&&(hp<50||hp>200)){toast("⚠️ รอบสะโพกควรอยู่ระหว่าง 50-200 cm");return;}
    if(nk&&(nk<20||nk>70)){toast("⚠️ รอบคอควรอยู่ระหว่าง 20-70 cm");return;}
    if(!w&&!hp&&!nk){toast("⚠️ กรอกอย่างน้อย 1 ค่า");return;}
    const body=LS.get(K.body,[]);
    let entry=body.find(b=>b.date===state.date);
    if(entry){if(w)entry.waist=w;if(hp)entry.hip=hp;if(nk)entry.neck=nk;}
    else{entry={date:state.date,weight:latestBodyMerged()?.weight||LS.get(K.profile,null)?.weight||70};if(w)entry.waist=w;if(hp)entry.hip=hp;if(nk)entry.neck=nk;body.push(entry);}
    LS.set(K.body,body);
    closeSheet();render();toast("✅ บันทึกค่าที่วัดแล้ว");
  };
  // preview WHR + Navy BF% สด ขณะพิมพ์
  (function(){
    const upd=()=>{
      const p=LS.get(K.profile,null);
      const w=+document.getElementById("waist-quick")?.value||0;
      const hp=+document.getElementById("hip-quick")?.value||0;
      const nk=+document.getElementById("neck-quick")?.value||0;
      const ht=p?.height||0;
      const box=document.getElementById("wm-preview");
      if(!box)return;
      const rows=[];
      if(w&&hp){
        const whr=w/hp,thr=p?.gender==="female"?0.85:0.90;
        rows.push({lbl:"WHR (เอว/สะโพก)",v:whr.toFixed(2),warn:whr>thr});
      }
      if(w&&nk&&ht){
        let bf=null;
        if(p?.gender==="female"){if(hp)bf=495/(1.29579-0.35004*Math.log10(w+hp-nk)+0.221*Math.log10(ht))-450;}
        else bf=495/(1.0324-0.19077*Math.log10(w-nk)+0.15456*Math.log10(ht))-450;
        if(bf!=null&&isFinite(bf)&&bf>2&&bf<70)rows.push({lbl:"Navy Body Fat %",v:bf.toFixed(1)+"%",warn:false});
      }
      box.innerHTML=rows.length?rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:7px 11px;background:${r.warn?"var(--red-bg)":"var(--teal-bg)"};border-radius:var(--r-sm);margin-bottom:5px;font-size:12px"><span style="color:var(--text2)">${r.lbl}</span><span style="font-weight:800;color:${r.warn?"var(--red)":"var(--teal)"}">${r.v}${r.warn?" ⚠️":""}</span></div>`).join(""):"";
    };
    ["waist-quick","hip-quick","neck-quick"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=upd;});
    upd();
  })();
  let imgState={mime:null,b64:null};
  const photoBox=document.getElementById("sc-photo"),form=document.getElementById("sc-form");
  function showForm(){photoBox.style.display="none";form.style.display="block";}
  renderScalePicker(photoBox,imgState,showForm,async()=>{
    setErr("sc-err","");const btn=document.getElementById("sc-analyze");if(btn){btn.textContent="🔍 กำลังอ่าน...";btn.disabled=true;}
    try{
      const txt=await callClaude({max_tokens:600,messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:imgState.mime,data:imgState.b64}},
        {type:"text",text:'อ่านค่าทั้งหมดจากจอเครื่องชั่ง/แอปในรูป ตอบ JSON เท่านั้น ค่าที่ไม่มีให้ null:\n{"weight":0,"bmi":0,"bodyFat":0,"fatMass":0,"muscleMass":0,"skeletalMuscle":0,"bmr":0,"heartRate":0,"waterPct":0,"proteinPct":0,"visceralFat":0,"subcutaneousFat":0,"boneMass":0,"metabolicAge":0}'}
      ]}]});
      const r=extractJSON(txt);
      ["weight","bmi","bodyFat","fatMass","muscleMass","skeletalMuscle","bmr","heartRate","waterPct","proteinPct","visceralFat","subcutaneousFat","boneMass","metabolicAge"].forEach(f=>{const el=document.getElementById("b-"+f);if(el&&r[f]!=null)el.value=r[f];});
      showForm();
    }catch(e){setErr("sc-err",aiError(e));showForm();}
  });
  document.getElementById("sc-save").onclick=()=>{
    const w=+document.getElementById("b-weight").value;
    if(!w){setErr("sc-err","กรุณาใส่น้ำหนัก");return;}
    const gv=id=>{const el=document.getElementById(id);return el&&el.value!==""?+el.value:null;};
    const entry={date:state.date,weight:w,
      bmi:gv("b-bmi"),bodyFat:gv("b-bodyFat"),fatMass:gv("b-fatMass"),
      muscleMass:gv("b-muscleMass"),skeletalMuscle:gv("b-skeletalMuscle"),
      bmr:gv("b-bmr"),heartRate:gv("b-heartRate"),
      waterPct:gv("b-waterPct"),proteinPct:gv("b-proteinPct"),
      visceralFat:gv("b-visceralFat"),subcutaneousFat:gv("b-subcutaneousFat"),
      boneMass:gv("b-boneMass"),metabolicAge:gv("b-metabolicAge")};
    const body=LS.get(K.body,[]);
    const existing=body.find(b=>b.date===state.date);
    if(existing?.waist!=null)entry.waist=existing.waist; // รักษาค่าที่วัดแยกไว้ ไม่ให้ถูกเขียนทับ
    if(existing?.hip!=null)entry.hip=existing.hip;
    if(existing?.neck!=null)entry.neck=existing.neck;
    const newBody=body.filter(b=>b.date!==state.date);
    newBody.push(entry);LS.set(K.body,newBody);
    closeSheet();render();toast("✅ บันทึกข้อมูลร่างกายแล้ว");
  };
}

function renderScalePicker(box,imgState,onManual,onAnalyze){
  box.innerHTML=`
    <div class="img-opts">
      <button class="imgbtn" id="sp-cam"><span class="ic2">📷</span><span class="tx">ถ่ายรูปจอชั่ง</span></button>
      <button class="imgbtn" id="sp-lib"><span class="ic2">🖼️</span><span class="tx">เลือกจากคลัง</span></button>
    </div>
    <button class="btn btn-ghost btn-block" id="sp-manual" style="margin-top:4px;margin-bottom:12px">✏️ กรอกเองโดยไม่ต้องถ่ายรูป</button>
    <input type="file" accept="image/*" capture="environment" id="sp-file-cam" style="display:none">
    <input type="file" accept="image/*" id="sp-file-lib" style="display:none">
    <div id="sp-preview"></div>
  `;
  const fCam=box.querySelector("#sp-file-cam"),fLib=box.querySelector("#sp-file-lib");
  box.querySelector("#sp-cam").onclick=()=>fCam.click();
  box.querySelector("#sp-lib").onclick=()=>fLib.click();
  box.querySelector("#sp-manual").onclick=onManual;
  const handleFile=f=>{
    if(!f)return;const r=new FileReader();
    r.onload=ev=>{
      const m=ev.target.result.match(/^data:(.*?);base64,(.*)$/);imgState.mime=m[1];imgState.b64=m[2];
      box.querySelector("#sp-preview").innerHTML=`
        <div style="text-align:center">
          <img src="${ev.target.result}" style="max-height:200px;border-radius:var(--r-md);border:1px solid var(--border);margin-bottom:10px">
          <div class="row">
            <button class="btn btn-ghost" id="sp-change">เปลี่ยนรูป</button>
            <button class="btn btn-primary" id="sc-analyze" style="flex:1">🤖 อ่านค่าด้วย AI</button>
          </div>
        </div>`;
      box.querySelector("#sp-change").onclick=()=>renderScalePicker(box,imgState,onManual,onAnalyze);
      box.querySelector("#sc-analyze").onclick=onAnalyze;
      box.querySelector(".img-opts").style.display="none";
      box.querySelector("#sp-manual").style.display="none";
    };r.readAsDataURL(f);
  };
  fCam.onchange=e=>handleFile(e.target.files[0]);
  fLib.onchange=e=>handleFile(e.target.files[0]);
}

/* หา log ครั้งล่าสุดของท่านี้ (ก่อนวันที่ปัจจุบัน) */
function lastExLog(name,beforeDate){
  for(let i=1;i<=60;i++){
    const d=addDays(beforeDate,-i);
    const log=LS.get(K.exlog(d),{});
    if(log[name])return log[name];
  }
  return null;
}

/* ── 1RM (Epley formula): weight × (1 + reps/30) ── */
function calc1RM(kg,reps){
  if(!kg||!reps)return 0;
  if(reps===1)return kg;
  return Math.round(kg*(1+reps/30));
}
/* หา best 1RM จาก log ของท่า (จากทุกเซ็ต) */
function best1RM(log){
  if(!log?.sets)return 0;
  return Math.max(0,...log.sets.map(s=>calc1RM(+s.kg||0,+s.reps||0)));
}
/* หา best น้ำหนักสูงสุด (heaviest set) */
function bestWeight(log){
  if(!log?.sets)return 0;
  return Math.max(0,...log.sets.map(s=>+s.kg||0));
}
/* volume ของ log (kg×reps รวม) */
function logVolume(log){
  if(!log?.sets)return 0;
  return log.sets.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);
}
/* เก็บประวัติท่า: [{date, oneRM, volume, topKg}] เรียงเก่า→ใหม่ (90 วัน) */
function exerciseHistory(name,upToDate){
  const hist=[];
  for(let i=90;i>=0;i--){
    const d=addDays(upToDate,-i);
    const log=(LS.get(K.exlog(d),{}))[name];
    if(log?.sets&&log.sets.length){
      hist.push({date:d,oneRM:best1RM(log),volume:logVolume(log),topKg:bestWeight(log)});
    }
  }
  return hist;
}
/* ตรวจ PR: เทียบ log วันนี้กับประวัติก่อนหน้า → คืน {newWeight, new1RM} */
function checkPR(name,date){
  const todayLog=(LS.get(K.exlog(date),{}))[name];
  if(!todayLog?.sets)return null;
  const todayW=bestWeight(todayLog),today1RM=best1RM(todayLog);
  let prevMaxW=0,prevMax1RM=0;
  for(let i=1;i<=180;i++){
    const d=addDays(date,-i);
    const log=(LS.get(K.exlog(d),{}))[name];
    if(log?.sets){prevMaxW=Math.max(prevMaxW,bestWeight(log));prevMax1RM=Math.max(prevMax1RM,best1RM(log));}
  }
  const pr={};
  if(todayW>prevMaxW&&prevMaxW>0)pr.newWeight=todayW;
  if(today1RM>prevMax1RM&&prevMax1RM>0)pr.new1RM=today1RM;
  return (pr.newWeight||pr.new1RM)?pr:null;
}

/* ── SVG line chart (self-contained, no library) ──
   data: [{x:label, y:number}], returns SVG string */
function lineChart(data,{color="var(--accent)",height=120,fill=true,unit=""}={}){
  if(!data||data.length<2)return`<div style="text-align:center;padding:24px;color:var(--text3);font-size:12px">ยังมีข้อมูลไม่พอวาดกราฟ (ต้องมีอย่างน้อย 2 จุด)</div>`;
  const W=300,H=height,pad={t:14,r:10,b:20,l:34};
  const iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const ys=data.map(d=>d.y);
  let min=Math.min(...ys),max=Math.max(...ys);
  if(min===max){min=min*0.9;max=max*1.1||1;}
  const rng=max-min;
  const px=i=>pad.l+(data.length===1?iw/2:i/(data.length-1)*iw);
  const py=v=>pad.t+ih-((v-min)/rng)*ih;
  const pts=data.map((d,i)=>`${px(i).toFixed(1)},${py(d.y).toFixed(1)}`).join(" ");
  const areaPath=`M${px(0)},${py(data[0].y)} `+data.map((d,i)=>`L${px(i)},${py(d.y)}`).join(" ")+` L${px(data.length-1)},${pad.t+ih} L${px(0)},${pad.t+ih} Z`;
  // y-axis labels (min, mid, max)
  const yl=[min,(min+max)/2,max];
  const gid="g"+Math.random().toString(36).slice(2,7);
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${yl.map(v=>{const y=py(v);return`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/><text x="${pad.l-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text3)">${Math.round(v)}</text>`;}).join("")}
    ${fill?`<path d="${areaPath}" fill="url(#${gid})"/>`:""}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((d,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(d.y).toFixed(1)}" r="${i===data.length-1?3.5:2}" fill="${color}"/>`).join("")}
    <text x="${pad.l}" y="${H-6}" font-size="8.5" fill="var(--text3)">${data[0].x}</text>
    <text x="${W-pad.r}" y="${H-6}" text-anchor="end" font-size="8.5" fill="var(--text3)">${data[data.length-1].x}</text>
  </svg>`;
}

/* บันทึกน้ำหนัก/reps แบบรายเซ็ต (S1-S4) */
function openExLog(ex){
  const exlog=LS.get(K.exlog(state.date),{});
  const cur=exlog[ex.name]||{};
  const last=lastExLog(ex.name,state.date);
  // จำนวนเซ็ตเป้าหมายจาก ex.sets เช่น "4x10" → 4 เซ็ต, default reps 10
  const sm=(ex.sets||"").match(/(\d+)\s*[xX×]\s*(\d+)/);
  const targetSets=sm?+sm[1]:(cur.sets?.length||3);
  const targetReps=sm?+sm[2]:10;
  // สร้าง set rows: ใช้ค่าเดิมถ้ามี ไม่งั้นใช้ค่าจากครั้งก่อน/เป้าหมาย
  let sets=[];
  if(cur.sets&&cur.sets.length){sets=cur.sets.map(s=>({...s}));}
  else{
    const lastSets=last?.sets;
    for(let i=0;i<targetSets;i++){
      sets.push({reps:lastSets?.[i]?.reps??targetReps,kg:lastSets?.[i]?.kg??last?.sets?.[0]?.kg??"",done:false});
    }
  }
  window._elSets=sets;
  const lastLine=last?(last.sets?`${last.sets.length} เซ็ต · ${last.sets.map(s=>s.kg+"×"+s.reps).join(", ")}`:(last.detail||"")):"";
  // ประวัติ + สถิติ
  const hist=exerciseHistory(ex.name,state.date);
  const allTime1RM=hist.length?Math.max(...hist.map(h=>h.oneRM)):0;
  const allTimeKg=hist.length?Math.max(...hist.map(h=>h.topKg)):0;
  const curLog=(LS.get(K.exlog(state.date),{}))[ex.name];
  const cur1RM=curLog?best1RM(curLog):0;
  showSheet(`
    <div class="handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div>
        <div class="sheetTitle">${esc(ex.name)}</div>
        <div class="sheetSub">${esc(ex.muscle||"")} · เป้า ${esc(ex.sets||"")}</div>
      </div>
      <button id="close-el" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--text2);cursor:pointer;flex-shrink:0">×</button>
    </div>
    ${(allTime1RM||cur1RM)?`<div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:var(--accent-bg);border-radius:var(--r-md);padding:10px;text-align:center"><div style="font-size:18px;font-weight:900;color:var(--accent2)">${cur1RM||"–"}</div><div style="font-size:9.5px;color:var(--text3)">1RM วันนี้ (kg)</div></div>
      <div style="flex:1;background:var(--bg3);border-radius:var(--r-md);padding:10px;text-align:center"><div style="font-size:18px;font-weight:900;color:var(--text)">${allTime1RM||"–"}</div><div style="font-size:9.5px;color:var(--text3)">🏆 1RM สูงสุด</div></div>
      <div style="flex:1;background:var(--bg3);border-radius:var(--r-md);padding:10px;text-align:center"><div style="font-size:18px;font-weight:900;color:var(--text)">${allTimeKg||"–"}</div><div style="font-size:9.5px;color:var(--text3)">น้ำหนักสูงสุด</div></div>
    </div>`:""}
    ${hist.length>=2?`<button class="btn btn-ghost btn-block" id="el-graph-btn" style="margin-bottom:12px">📈 ดูกราฟความก้าวหน้า (${hist.length} ครั้ง)</button><div id="el-graph" style="display:none;margin-bottom:12px"></div>`:""}
    ${lastLine?`<div style="display:flex;align-items:center;gap:8px;background:var(--teal-bg);border-radius:var(--r-md);padding:9px 12px;margin-bottom:14px"><span style="font-size:15px">📈</span><span style="font-size:11px;color:var(--text2)">ครั้งก่อน: ${esc(lastLine)}</span></div>`:""}
    <div id="el-sets"></div>
    <button class="btn btn-ghost btn-block" id="el-addset" style="margin:4px 0 12px">➕ เพิ่มเซ็ต</button>

    box.querySelectorAll(".el-del").forEach(b=>b.onclick=()=>{window._elSets.splice(+b.dataset.si,1);if(!window._elSets.length)window._elSets.push({reps:targetReps,kg:"",done:false});renderSets();});

  document.getElementById("el-save").onclick=()=>{

async function generatePlan(errId){
  const p=LS.get(K.profile,null);
  try{
    const txt=await callClaude({
      max_tokens:4000,
      system:"คุณคือผู้เชี่ยวชาญด้านการสร้างแผนออกกำลังกาย ตอบ JSON เท่านั้น ห้ามมีข้อความอื่น ห้ามใช้ markdown code block ห้ามเพิ่มความเห็น หรือคำอธิบาย เอาแค่ JSON object ที่เป็น valid JSON ตรวจสอบให้แน่ใจว่า days มี 7 element พอดี",
      messages:[{role:"user",content:`สร้างแผนออกกำลังกาย 7 วัน สำหรับ เพศ${p.gender==="male"?"ชาย":"หญิง"} อายุ${p.age}ปี เป้าหมาย${GOALS.find(g=>g.id===p.goal)?.label||"ลดไขมัน"}

หลักการสำคัญ (ต้องทำตาม):
- ผสมผสาน weights training กับ Zone 2 cardio เสมอ
- Zone 2 cardio (เดินชัน/เดินเร็ว/ปั่นจักรยานเบาๆ ที่ 60-70% max HR) ให้มี 2-3 วัน เป็นพื้นฐานสำคัญ
- Weights training ให้มี 2-3 วัน โดยแบ่ง muscle group ต่างกัน
- มีวันพัก 1-2 วัน
- สามารถรวม weights + zone 2 ในวันเดียวกันได้ (เช่น เวทเสร็จต่อด้วยเดินชัน 20-30 นาที)

ตอบ JSON object เท่านั้น (ไม่ต้อง markdown code block ไม่ต้องข้อความ) — เพิ่ม "rationale" อธิบายสั้นๆ (1-2 ประโยค) ว่าทำไมถึงจัด volume/วันพักแบบนี้ ให้ AI หรือผู้ใช้ย้อนดูทีหลังได้ว่าทำไมถึงออกแบบแบบนี้:
{"rationale":"เน้น Zone 2 3 วันเพื่อ deficit จากคาร์ดิโอ + เวท 3 วันรักษากล้ามเนื้อระหว่างลดไขมัน มีวันพัก 2 วันสลับกับวันหนัก ป้องกัน overtraining","days":[{"day":"วันที่ 1","focus":"หน้าอก/ไหล่ + Zone 2","exercises":[{"name":"Bench Press","sets":"4x10","muscle":"หน้าอก"},{"name":"เดินชัน Zone 2","sets":"20 นาที","muscle":"cardio"}]},{"day":"วันที่ 2","focus":"Zone 2 Cardio","exercises":[{"name":"เดินชัน Zone 2","sets":"45 นาที","muscle":"cardio"}]},{"day":"วันที่ 3","focus":"ขา + Zone 2","exercises":[{"name":"Squat","sets":"4x12","muscle":"ต้นขา"}]},{"day":"วันที่ 4","focus":"วันพัก","exercises":[]},{"day":"วันที่ 5","focus":"หลัง/แขน","exercises":[{"name":"Pull-up","sets":"3x8","muscle":"หลัง"}]},{"day":"วันที่ 6","focus":"Zone 2 Cardio","exercises":[{"name":"เดินชัน Zone 2","sets":"45 นาที","muscle":"cardio"}]},{"day":"วันที่ 7","focus":"วันพัก","exercises":[]}]}
ต้องมี days เป็น array ที่มี 7 object พอดี (วันที่ 1-7) ไม่มากไม่น้อย`}]
    });
    let r;
    try{
      r=extractJSON(txt);
    }catch(parseErr){
      console.error("Plan parse failed. Raw response:",txt);
      throw new Error("PARSE: AI ตอบกลับไม่ใช่ JSON ที่อ่านได้ — ขึ้นต้นว่า: "+String(txt).trim().slice(0,80));
    }
    if(!r||typeof r!=="object"){
      throw new Error("AI ไม่ส่ง JSON object — ลองใหม่ครับ");
    }
    if(!r.days||!Array.isArray(r.days)){
      throw new Error(`ไม่มี "days" array (ได้ ${typeof r.days}) — ลองใหม่`);
    }
    if(r.days.length!==7){
      throw new Error(`แผนไม่ครบ 7 วัน ได้ ${r.days.length} วัน — ลองใหม่`);
    }
    if(!r.days.every(d=>d&&Array.isArray(d.exercises))){
      throw new Error("บางวันไม่มี exercises array — ลองใหม่");
    }
    // เก็บบริบทตอนสร้างแผน — เผื่อย้อนดูทีหลังว่าทำไมออกแบบแบบนี้
    LS.set(K.plan,{
      days:r.days,createdAt:todayStr(),
      rationale:r.rationale||null,
      goalAtCreation:p.goal||null,
      goalLabelAtCreation:GOALS.find(g=>g.id===p.goal)?.label||null,
      source:"ai-generated"
    });
    render();toast("✅ สร้างแผนสำเร็จ");
  }catch(e){setErr(errId,aiError(e));}
}

function weeklySummaryCard(){
  const today=todayStr();
  let totalCal=0,totalBurn=0,daysFood=0,daysWorkout=0;
  for(let i=0;i<7;i++){
    const d=addDays(today,-i);
    const fl=LS.get(K.food(d),[]);if(fl.length){totalCal+=fl.reduce((a,f)=>a+f.cal,0);daysFood++;}
    const cl=LS.get(K.cardio(d),[]);totalBurn+=cl.reduce((a,c)=>a+(c.calories||0),0);
    const wl=LS.get(K.workout(d),[]);if(wl.length)daysWorkout++;
  }
  const avgCal=daysFood?Math.round(totalCal/daysFood):0;
  const body=LS.get(K.body,[]).sort((a,b)=>a.date<b.date?-1:1);
  const bodyWeek=body.filter(e=>e.date>=addDays(today,-7));
  const wChg=bodyWeek.length>=2?(bodyWeek[bodyWeek.length-1].weight-bodyWeek[0].weight).toFixed(1):null;

/* ════ PROGRESS TIMELINE ════ */
function progressTimelineCard(p){
  if(!p)return"";
  const body=LS.get(K.body,[]).sort((a,b)=>a.date<b.date?-1:1);
  if(body.length<2)return"";
  const f=body[0],l=body[body.length-1];
  const days=Math.max(1,(new Date(l.date)-new Date(f.date))/86400000);
  const wksElapsed=days/7;
  const rows=[];
  // weight timeline
  if(p.targetWeight&&l.weight&&f.weight){
    const ratePerWk=(l.weight-f.weight)/wksElapsed;
    const left=l.weight-p.targetWeight;
    if(ratePerWk<-0.01&&left>0){
      const wksLeft=Math.ceil(Math.abs(left/ratePerWk));
      const targetD=addDays(todayStr(),wksLeft*7);
      const d2=new Date(targetD+"T00:00:00");
      const months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
      rows.push({label:`น้ำหนัก ${p.targetWeight} kg`,date:`${d2.getDate()} ${months[d2.getMonth()]} ${d2.getFullYear()}`,weeks:wksLeft,rate:`${Math.abs(ratePerWk).toFixed(2)} kg/สัปดาห์`});
    }else if(left<=0){rows.push({label:`น้ำหนัก ${p.targetWeight} kg`,done:true});}
  }
  // bf timeline
  if(p.targetBf&&l.bodyFat!=null&&f.bodyFat!=null){
    const ratePerWk=(l.bodyFat-f.bodyFat)/wksElapsed;
    const left=l.bodyFat-p.targetBf;
    if(ratePerWk<-0.01&&left>0){
      const wksLeft=Math.ceil(Math.abs(left/ratePerWk));
      const targetD=addDays(todayStr(),wksLeft*7);
      const d2=new Date(targetD+"T00:00:00");
      const months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
      rows.push({label:`ไขมัน ${p.targetBf}%`,date:`${d2.getDate()} ${months[d2.getMonth()]} ${d2.getFullYear()}`,weeks:wksLeft,rate:`${Math.abs(ratePerWk).toFixed(2)}%/สัปดาห์`});
    }else if(left<=0){rows.push({label:`ไขมัน ${p.targetBf}%`,done:true});}
  }
  if(!rows.length)return"";
  return`<div class="card">
    <div class="lbl" style="margin-bottom:12px">🎯 คาดการณ์ถึงเป้าหมาย</div>
    <div class="small" style="margin-bottom:12px">คำนวณจากอัตราเฉลี่ยของคุณ (${body.length} ครั้งที่ชั่ง / ${Math.round(days)} วัน)</div>
    ${rows.map(r=>r.done?`
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)">
        <span style="font-size:18px">🏆</span>
        <div><div style="font-size:13px;font-weight:700;color:var(--green)">บรรลุเป้า ${r.label} แล้ว!</div></div>
      </div>`:`
      <div style="padding:10px 0;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:13px;font-weight:700;color:var(--text)">${r.label}</span>
          <span style="font-size:13px;font-weight:800;color:var(--accent2)">${r.date}</span>
        </div>
        <div style="font-size:11px;color:var(--text3)">อีก ${r.weeks} สัปดาห์ · ปัจจุบัน ${r.rate}</div>
      </div>`).join("")}
    <div class="note" style="margin-top:10px;font-size:11px">⚠️ การคาดการณ์อิงจากอัตราปัจจุบัน อาจเปลี่ยนแปลงตามพฤติกรรมจริง</div>
  </div>`;
}

/* mode: "auto" = ตามวันจริง | "off" = ม่วงปกติ | "sun".."sat" = ล็อกสีเดียว */
function getThemeMode(){return LS.get(K.theme,"off");}
function setThemeMode(m){LS.set(K.theme,m);applyTheme();}
function activeThemeId(){
  const m=getThemeMode();
  if(m==="off")return null;
  if(m==="auto")return DAY_THEMES[new Date().getDay()].id;
  return DAY_THEMES.some(t=>t.id===m)?m:null;
}
function applyTheme(){
  const id=activeThemeId();
  const root=document.documentElement;
  if(id)root.setAttribute("data-theme",id);
  else root.removeAttribute("data-theme");
  // อัปเดตสี status bar ให้เข้ากับธีม
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt){
    const bg=getComputedStyle(root).getPropertyValue("--bg").trim();
    if(bg)mt.setAttribute("content",bg);
  }
}

/* ══════════════════════════════════════
   EXPORT / IMPORT — สำรองข้อมูลกันหาย (localStorage หายได้ถ้าล้าง cache)
══════════════════════════════════════ */
function exportAllData(){
  const data={_meta:{app:"FitLog",version:1,exportedAt:new Date().toISOString(),device:navigator.userAgent.slice(0,80)},data:{}};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith("fl_"))continue;
    if(k===K.key)continue; // ไม่ export API key ด้วยเหตุผลความปลอดภัย
    try{data.data[k]=JSON.parse(localStorage.getItem(k));}catch(_){data.data[k]=localStorage.getItem(k);}
  }
  data._meta.keyCount=Object.keys(data.data).length;
  return data;
}
function downloadBackup(){
  const data=exportAllData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`fitlog-backup-${todayStr()}.json`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},200);
  return data._meta.keyCount;
}
/* นับสรุปข้อมูลในไฟล์ backup ให้ผู้ใช้เห็นก่อนกู้คืน */
function summarizeBackup(data){
  const d=data?.data||{};
  const cnt=pre=>Object.keys(d).filter(k=>k.startsWith(pre)).length;
  return{
    foodDays:cnt("fl_food_"),workoutDays:cnt("fl_wk_"),cardioDays:cnt("fl_cardio_"),
    exlogDays:cnt("fl_exlog_"),bodyRecords:(d.fl_body||[]).length,
    hasProfile:!!d.fl_profile,hasPlan:!!d.fl_plan,
    total:Object.keys(d).length,exportedAt:data?._meta?.exportedAt||null
  };
}
function importAllData(data,mode){
  if(!data||!data.data||typeof data.data!=="object")throw new Error("ไฟล์ไม่ถูกต้อง — ไม่พบข้อมูล FitLog");
  if(data._meta?.app!=="FitLog")throw new Error("ไฟล์นี้ไม่ใช่ไฟล์สำรองของ FitLog");
  const keys=Object.keys(data.data);
  if(!keys.length)throw new Error("ไฟล์ว่างเปล่า ไม่มีข้อมูลให้กู้คืน");
  if(mode==="replace"){
    // ลบข้อมูลเดิมทั้งหมด (ยกเว้น API key)
    const del=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("fl_")&&k!==K.key)del.push(k);
    }
    del.forEach(k=>localStorage.removeItem(k));
  }
  let n=0;
  keys.forEach(k=>{
    if(k===K.key)return;
    try{localStorage.setItem(k,JSON.stringify(data.data[k]));n++;}catch(_){}
  });
  return n;
}

/* ── ตรวจจับช่วงเวลาจากข้อความผู้ใช้ ── */
function extractLookback(text){
  const t=(text||"").toLowerCase();
  const dm=t.match(/(\d+)\s*วัน/);if(dm)return Math.min(90,Math.max(1,+dm[1]));
  const wm=t.match(/(\d+)\s*สัปดาห์/);if(wm)return Math.min(90,+wm[1]*7);
  const mm=t.match(/(\d+)\s*เดือน/);if(mm)return Math.min(90,+mm[1]*30);
  if(/สัปดาห์ที่แล้ว|อาทิตย์ที่แล้ว/.test(t))return 7;
  if(/เดือนที่แล้ว|เดือนนี้/.test(t))return 30;
  if(/ทั้งหมด|ทั้งปี/.test(t))return 90;
  return 7; // default
}

function buildContext(lookbackDays=7){
  const p=LS.get(K.profile,null),t=computeTargets(p,latestBody()),lb=latestBody();
  // สำคัญ: ใช้วันจริงเสมอ (ไม่ใช่ state.date) — ผู้ใช้อาจกำลังเปิดดูข้อมูลวันอื่นค้างไว้
  // แต่เวลาคุยกับโค้ช "วันนี้" ต้องหมายถึงวันนี้จริงเท่านั้น กันความสับสนเรื่องวันที่
  const d=todayStr();
  const browsingOtherDay=state.date!==d;
  const todayFood=LS.get(K.food(d),[]);
  const tt=todayFood.reduce((a,f)=>({c:a.c+f.cal,p:a.p+f.protein,cb:a.cb+f.carb,ft:a.ft+f.fat}),{c:0,p:0,cb:0,ft:0});
  let planLine="ยังไม่มีแผน";const plan=LS.get(K.plan,null);
  let planWeekLine="";
  if(plan){
    const di=planDayIndex(d);const tp=plan.days?.[di];const wl=LS.get(K.workout(d),[]);
    planLine=`วัน${PLAN_DAY_NAMES[di]} (วันที่ ${di+1}/7) - ${tp?.focus||"วันพัก"} (ทำ ${wl.length} ท่า)`;
    // ภาพรวมทั้ง 7 วัน — ไม่ใช่แค่วันนี้ ให้ AI ประเมิน pattern การพัก/volume ทั้งสัปดาห์ได้
    const weekOverview=(plan.days||[]).map((dy,i)=>{
      const restDay=!dy.exercises||dy.exercises.length===0;
      const exCount=dy.exercises?.length||0;
      const marker=i===di?" ← วันนี้":"";
      return `  วัน${PLAN_DAY_NAMES[i]} (วันที่ ${i+1}): ${dy.focus||"วันพัก"}${restDay?" (พัก)":` (${exCount} ท่า)`}${marker}`;
    }).join("\n");
    const restCount=(plan.days||[]).filter(dy=>!dy.exercises||dy.exercises.length===0).length;
    planWeekLine=`\nแผนออกกำลังทั้งสัปดาห์ (สร้างเมื่อ ${plan.createdAt}, วันพักรวม ${restCount}/7 วัน, ที่มา: ${plan.source==="ai-generated"?"AI สร้างอัตโนมัติ":plan.source==="coach-chat"?"สร้างจากคุยกับโค้ช":plan.source==="coach-chat-partial"?"ปรับบางส่วนจากคุยกับโค้ช":"ไม่ทราบ"}):\n${weekOverview}`;
    if(plan.goalLabelAtCreation)planWeekLine+=`\nเป้าหมายตอนสร้างแผนนี้: ${plan.goalLabelAtCreation}${p.goal!==plan.goalAtCreation?` ⚠️ ต่างจากเป้าหมายปัจจุบัน (${GOALS.find(g=>g.id===p.goal)?.label}) — แผนอาจไม่เหมาะแล้ว`:""}`;
    if(plan.rationale)planWeekLine+=`\nเหตุผลตอนออกแบบแผนนี้: ${plan.rationale}`;
    if(plan.lastAdjusted)planWeekLine+=`\nปรับล่าสุดเมื่อ ${plan.lastAdjusted.date} (วันที่ ${plan.lastAdjusted.range}): ${plan.lastAdjusted.reason||"ไม่ระบุเหตุผล"}`;
  }
  const todayList=todayFood.map(f=>`${MEALS.find(m=>m.id===f.meal)?.label}: ${f.name} ${f.cal}kcal`).join("; ")||"ยังไม่บันทึก";
  const cardio=LS.get(K.cardio(d),[]);
  const burn=cardio.reduce((a,c)=>a+(c.calories||0),0);
  const cardioList=cardio.map(c=>`${c.activity} ${c.duration||""} (${c.calories}kcal)`).join("; ")||"ยังไม่มี";
  let dcalLine="ไม่มี (ใช้เป้าปกติทุกวัน)";
  const dcals=[];
  for(let i=0;i<7;i++){const dd=addDays(d,i);const o=LS.get(K.dcal(dd),null);if(o&&typeof o.cal==="number")dcals.push(`${dd.slice(5)}:${o.cal}`);}
  if(dcals.length)dcalLine=dcals.join(", ");
  const dt=dayTarget(d,t);
  const hr=hrZone(p.age,lb?.heartRate);
  const hrLine=hr?`Max HR ${hr.maxHR}, Resting ${hr.rest}bpm${hr.usedDefault?"(ค่าเริ่มต้น)":"(จากเครื่องชั่ง)"} | ${hr.zones.map(z=>`Z${z.n}:${z.min}-${z.max}`).join(" ")}`:"ไม่มี (ขาดอายุ)";

  /* ── ประวัติย้อนหลัง N วัน ── */
  // รูปแบบไม่กำกวม: วันในสัปดาห์ + วันที่ + เดือนไทย + คำบอกระยะ (กันโมเดลตีความ D/M สลับกัน หรือไล่วันผิด)
  const WD=["อา","จ","อ","พ","พฤ","ศ","ส"];
  const MO=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const ds=(dateStr,i)=>{
    const dt=new Date(dateStr+"T00:00:00");
    const rel=i===1?"เมื่อวาน":i===2?"2 วันก่อน":`${i} วันก่อน`;
    const yNow=new Date().getFullYear();
    const yStr=dt.getFullYear()!==yNow?" "+dt.getFullYear():"";
    return `${WD[dt.getDay()]} ${dt.getDate()} ${MO[dt.getMonth()]}${yStr} (${rel})`;
  };

  // อาหารย้อนหลัง
  const foodHist=[];
  let totCal=0,totDays=0;
  for(let i=1;i<=lookbackDays;i++){
    const dd=addDays(d,-i);
    const fl=LS.get(K.food(dd),[]);
    if(fl.length){
      const cal=fl.reduce((a,f)=>a+f.cal,0);
      const prot=Math.round(fl.reduce((a,f)=>a+(f.protein||0),0));
      const flag=cal>t.cal*1.12?"⚠️เกิน":cal>=t.cal*0.85?"✅":"🔽ต่ำ";
      foodHist.push(`  ${ds(dd,i)}: ${cal}kcal P${prot}g ${flag}`);
      totCal+=cal;totDays++;
    }else{
      foodHist.push(`  ${ds(dd,i)}: ไม่บันทึก`);
    }
  }
  const avgCal=totDays?Math.round(totCal/totDays):0;

  // Workout ย้อนหลัง
  const wkHist=[];
  for(let i=1;i<=lookbackDays;i++){
    const dd=addDays(d,-i);
    const done=LS.get(K.workout(dd),[]);
    const exlog=LS.get(K.exlog(dd),{});
    const crd=LS.get(K.cardio(dd),[]);
    if(!done.length&&!crd.length)continue;
    const parts=[];
    if(done.length){
      const exParts=done.slice(0,4).map(name=>{
        const lg=exlog[name];
        if(lg?.sets?.length){const b=lg.sets.reduce((a,s)=>(+s.kg||0)>(+a.kg||0)?s:a,lg.sets[0]);return `${name}(${b.kg||0}×${b.reps||0})`;}
        return name;
      });
      const vol=Object.values(exlog).reduce((a,lg)=>a+logVolume(lg),0);
      parts.push(`เวท: ${exParts.join(",")}${vol?` [vol ${vol}kg]`:""}`);
    }
    if(crd.length){
      const cb=crd.reduce((a,c)=>a+(c.calories||0),0);
      parts.push(`cardio: ${crd.map(c=>c.activity+(c.duration?" "+c.duration:"")).join("+")} (${cb}kcal)`);
    }
    wkHist.push(`  ${ds(dd,i)}: ${parts.join(" | ")}`);
  }

  // น้ำหนัก trend
  const bodyRec=LS.get(K.body,[]).filter(b=>b.date>=addDays(d,-lookbackDays)&&b.date<=d).sort((a,b)=>a.date<b.date?-1:1);
  let trendLine="ไม่มีข้อมูลพอ";
  if(bodyRec.length>=2){
    const diff=+(bodyRec[bodyRec.length-1].weight-bodyRec[0].weight).toFixed(1);
    trendLine=`${bodyRec.map(b=>b.weight).slice(-6).join("→")} (${diff>0?"+":""}${diff}kg ใน ${lookbackDays}วัน)`;
  }else if(bodyRec.length===1){
    trendLine=`${bodyRec[0].weight}kg (มีข้อมูลแค่วันเดียวในช่วงนี้)`;
  }

  // น้ำ + fasting
  let totalW=0,wDays=0;
  for(let i=0;i<lookbackDays;i++){const w=LS.get(K.water(addDays(d,-i)),null);if(w!=null){totalW+=w;wDays++;}}
  const avgW=wDays?+(totalW/wDays).toFixed(1):null;
  const fast=LS.get(K.fast,null);
  const fastLine=fast&&fast.total?`${fast.mode||"16:8"} · streak ${fast.streak||0} วัน · สำเร็จ ${fast.done||0}/${fast.total||0} ครั้ง`:null;

  // ── ผลจาก ENGINE (คำนวณแล้ว AI มีหน้าที่อธิบาย ไม่ใช่คำนวณเอง) ──
  const dec=calorieDecision(d);
  const audit=energyAudit(d,7);
  const wt7=weightTrend(d,7);
  const wst=waistTrend(d,14);
  const intake14=avgIntake(d,14);
  const confToday=dayConfidence(d);
  const engineLines=[];
  if(wt7)engineLines.push(`น้ำหนัก 7-day avg: ${wt7.now}kg (ก่อนหน้า ${wt7.prev}kg) เปลี่ยน ${wt7.delta>0?"+":""}${wt7.delta}kg = ${wt7.perWeek>0?"+":""}${wt7.perWeek}kg/สัปดาห์ [${wt7.dir}]`);
  else engineLines.push("น้ำหนัก trend: ข้อมูลไม่พอ (ต้องชั่งบ่อยขึ้น)");
  {
    const ta=computeAdaptiveTdee(d),tadj=getTdeeAdj();
    if(ta){
      if(!tadj.enabled)engineLines.push(`Adaptive TDEE: ปิดใช้งาน — ใช้ค่าสูตร ${ta.formulaTdee} kcal`);
      else if(ta.status==="ok")engineLines.push(`Adaptive TDEE: TDEE จริงที่คำนวณจากผลลัพธ์ ≈ ${ta.impliedTdee} kcal (สูตรบอก ${ta.formulaTdee}, ใช้อยู่ ${ta.currentTdee})${ta.wasClamped?" ⚠️ค่าคำนวณเกินกรอบ±20% ถูกจำกัดไว้ — อาจบันทึกคลาดเคลื่อน":""}${ta.pendingChange?` — รอผู้ใช้ยืนยันปรับเป็น ${ta.newTdee}`:" — ตรงกันแล้ว"}`);
      else engineLines.push(`Adaptive TDEE: ยังเรียนรู้ไม่ได้ (${ta.status==="low-confidence"?`ความแม่นยำ ${ta.conf}% ต่ำกว่าเกณฑ์ ${ta.need}%`:ta.status==="insufficient-days"?`บันทึกแค่ ${ta.days}/${ta.need} วัน`:"ข้อมูลน้ำหนักไม่พอ"}) — ใช้ค่าสูตร ${ta.formulaTdee}`);
    }
  }
  {
    const nf=weightNoiseExplain(d);
    if(nf)engineLines.push(`Weight Noise Filter: ${nf.text}`);
    const dow=new Date(d+"T00:00:00").getDay();
    engineLines.push(dow===1?"วันนี้จันทร์ — วันสรุป Weekly Check-in เต็มรูปแบบ":"ไม่ใช่วันจันทร์ — คำแนะนำปรับแคลอรี่ปกติ (hold/decrease) จะรอสรุปวันจันทร์ เว้นแต่มีเรื่องความปลอดภัยเร่งด่วน");
  }
  {
    const eb=computeEnergyBank(d);
    engineLines.push(`Energy Bank: ${eb.score}/100 (${eb.verdict}) — คุณภาพข้อมูล ${eb.dataQuality}%, บันทึก ${eb.loggedDays}/7 วัน, เทรนด์สอดคล้อง ${eb.trendHealth}%`);
    const yj=getJournal(addDays(d,-1));
    if(yj.tags.length)engineLines.push(`Journal เมื่อวาน: ${yj.tags.map(journalLabel).join(", ")}${yj.note?` — โน้ต: "${yj.note}"`:""}`);
  }
  if(wst)engineLines.push(`รอบเอว 14 วัน: ${wst.first}→${wst.last}cm (${wst.delta>0?"+":""}${wst.delta}cm) [${wst.dir}]`);
  {
    const lbCtx=latestBodyMerged();const pCtx=LS.get(K.profile,null);
    const whrCtx=calcWHR(lbCtx?.waist,lbCtx?.hip);
    if(whrCtx!=null)engineLines.push(`WHR (เอว/สะโพก): ${whrCtx} ${whrRisk(whrCtx,pCtx?.gender)?"⚠️สูงกว่าเกณฑ์ปลอดภัย":"✅ปกติ"}`);
    const navyCtx=calcNavyBF(lbCtx?.waist,lbCtx?.neck,pCtx?.height,pCtx?.gender,lbCtx?.hip);
    if(navyCtx!=null)engineLines.push(`Navy Body Fat % (คำนวณจากรอบวัด อิสระจาก BIA): ${navyCtx}%${lbCtx?.bodyFat!=null?` (BIA บอก ${lbCtx.bodyFat}%)`:""}`);
  }
  if(intake14)engineLines.push(`กินเฉลี่ย 14 วัน: ${intake14.avg} kcal/วัน (บันทึก ${intake14.days}/14 วัน, ความแม่นยำ ${intake14.conf??"?"}%)`);
  if(audit&&audit.status!=="insufficient"&&audit.status!=="no-weight"){
    engineLines.push(`Energy Audit 7 วัน: deficit ${audit.dailyDeficit} kcal/วัน → คาดว่าน้ำหนัก ${audit.expectedKg}kg แต่จริง ${audit.actualKg}kg (ต่าง ${audit.mismatch}kg)${audit.status.startsWith("mismatch")?" ⚠️MISMATCH":" ✅ตรงกัน"}`);
  }
  if(dec)engineLines.push(`คำตัดสินของ Engine: [${dec.action}] ${dec.reason}${dec.newTarget?` → เป้าใหม่ ${dec.newTarget} kcal`:""}`);
  if(confToday!=null)engineLines.push(`ความแม่นยำข้อมูลวันนี้: ${confToday}%`);
  const ovCtx=getOverride(d);
  if(ovCtx)engineLines.push(`⚡ เป้าเฉพาะกิจที่ผู้ใช้ยืนยันไว้: ${ovCtx.delta>0?"+":""}${ovCtx.delta} kcal${ovCtx.reason?` (${ovCtx.reason})`:""} เหลืออีก ${daysLeftOverride(d,ovCtx)} วัน ถึง ${ovCtx.until} — เคารพการตัดสินใจนี้ ไม่ต้องเสนอยกเลิกเว้นแต่ผู้ใช้ถาม หรือมีสัญญาณอันตราย`);

  return`[วันนี้จริงคือ: ${fmtDate(d)} ${d} — ใช้วันนี้เป็นหลักเสมอเวลาพูดถึง "วันนี้/พรุ่งนี้/เมื่อวาน" ห้ามสับสนกับวันที่อื่นที่กล่าวถึงด้านล่าง]
${browsingOtherDay?`[หมายเหตุ: ผู้ใช้กำลังเปิดดูข้อมูลของวันที่ ${fmtDate(state.date)} (${state.date}) ค้างอยู่ในแอป แต่ไม่ได้แปลว่าเขาหมายถึงวันนั้นเวลาพูดคุย เว้นแต่เขาระบุชัดเจน]\n`:""}
[ข้อมูลผู้ใช้ | ย้อนหลัง ${lookbackDays} วันจากวันนี้]
โปรไฟล์: ${p.gender==="male"?"ชาย":"หญิง"} อายุ ${p.age} สูง ${p.height}cm
ปัจจุบัน: น้ำหนัก ${lb?.weight||p.weight}kg BMI ${lb?.bmi||"-"} ไขมัน ${lb?.bodyFat!=null?lb.bodyFat+"%":"-"} มวลไขมัน ${lb?.fatMass!=null?lb.fatMass+"kg":"-"}
กล้ามเนื้อรวม ${lb?.muscleMass||"-"}kg กล้ามโครงร่าง ${lb?.skeletalMuscle||"-"}kg BMR ${t.bmr}
น้ำในร่างกาย ${lb?.waterPct!=null?lb.waterPct+"%":"-"} โปรตีน ${lb?.proteinPct!=null?lb.proteinPct+"%":"-"} ไขมันช่องท้อง ${lb?.visceralFat||"-"} หัวใจ ${lb?.heartRate!=null?lb.heartRate+"bpm":"-"}
HR Zone (Karvonen): ${hrLine}
เป้าหมาย: น้ำหนัก ${p.targetWeight||"-"}kg ไขมัน ${p.targetBf||"-"}%
แคลอรี่เป้าหมาย: ${t.cal} kcal (P${t.protein} C${t.carb} F${t.fat}) TDEE ${t.tdee}
เป้าวันนี้: ${dt.cal} kcal${dt.banked?" [ปรับโดยแผน]":""}
เป้าแคลอรี่รายวันที่ตั้งไว้: ${dcalLine}
วันนี้: กินไป ${tt.c} kcal เผาผลาญ ${burn} kcal สุทธิ ${tt.c-burn} kcal | P${tt.p} C${tt.cb} F${tt.ft}g
มื้อวันนี้: ${todayList}
คาร์ดิโอวันนี้: ${cardioList}
แผนวันนี้: ${planLine}${planWeekLine}
--- ประวัติ ${lookbackDays} วัน ---
อาหาร (เฉลี่ย ${avgCal} kcal/วัน):
${foodHist.join("\n")}
Workout (${wkHist.length} วันที่ออกกำลัง):
${wkHist.join("\n")||"  ไม่มีข้อมูล"}
น้ำหนัก trend: ${trendLine}
${avgW!=null?`น้ำเฉลี่ย: ${avgW} แก้ว/วัน`:"น้ำ: ไม่มีข้อมูล"}
${fastLine?`Fasting: ${fastLine}`:""}
=== ผลการคำนวณจาก ENGINE (เชื่อถือได้ ใช้อ้างอิงได้เลย) ===
${engineLines.join("\n")}`;
}

async function coachSend(text){
  text=(text||"").trim();if(!text)return;
  const lookbackDays=extractLookback(text);
  coachMsgs.push({role:"user",text});
  const inp=document.getElementById("coach-input");if(inp)inp.value="";
  renderCoachUI();
  const body=document.getElementById("chatbody");
  if(body)body.insertAdjacentHTML("beforeend",`<div class="msg ai" id="typing"><div class="avatar" style="width:28px;height:28px;font-size:13px;flex-shrink:0">💬</div><div class="dots"><span></span><span></span><span></span></div></div>`);
  if(body)body.scrollTop=body.scrollHeight;
  const sys=`คุณคือเทรนเนอร์ส่วนตัวมืออาชีพด้านลดไขมัน/ปั้นหุ่น พูดภาษาไทยเป็นกันเองแต่แม่นยำ
ใช้ข้อมูลจริงด้านล่าง ห้ามเดา ตอบกระชับ เป็นขั้นตอน บอกตัวเลขชัดเจน

**เรื่องวันที่ — สำคัญมาก:**
ข้อความของผู้ใช้แต่ละครั้งจะขึ้นต้นด้วย [วันที่จริงตอนส่งข้อความนั้น] เช่น "[อ 7 ก.ค. 2026-07-07] สวัสดีครับ" — นี่คือ metadata บอกว่าข้อความนั้นถูกส่งวันไหนจริง ไม่ใช่เนื้อหาที่ผู้ใช้พิมพ์ ห้ามพูดถึงหรือย้ำ tag นี้กับผู้ใช้ และห้ามสับสนวันที่ของข้อความเก่ากับวันนี้ — ให้ยึด "วันนี้จริงคือ" ที่ระบุในข้อมูลด้านล่างเป็นหลักเสมอเวลาตอบเรื่อง "วันนี้/พรุ่งนี้/เมื่อวาน"

**สำคัญ — บทบาทของคุณคือ "อธิบาย" ไม่ใช่ "คำนวณเอง":**
- ระบบมี ENGINE คำนวณ trend/deficit/คำแนะนำปรับแคลอรี่มาให้แล้ว (ดูส่วน "ผลการคำนวณจาก ENGINE")
- ให้ยึดคำตัดสินของ Engine เป็นหลัก คุณมีหน้าที่อธิบายว่าทำไม ให้กำลังใจ และตอบคำถามเพิ่มเติม
- **โดยปกติห้ามแนะนำปรับแคลอรี่ขัดกับ Engine** ถ้า Engine บอก [hold] อย่าไปเสนอให้ลดแคลเอง
- **Weekly Check-in:** คำแนะนำปรับแคลอรี่แบบ hold/decrease ตามปกติ ให้เน้นสรุปแบบเต็มเฉพาะวันจันทร์ (ดูใน context ว่าวันนี้จันทร์ไหม) วันอื่นถ้าผู้ใช้ถาม ตอบได้แต่เตือนว่ากำลังรอดูแนวโน้มจนถึงจันทร์ เว้นแต่มีเรื่องความปลอดภัยเร่งด่วน (ลดเร็วเกิน/ข้อมูลผิดปกติ) ที่ต้องแจ้งทันทีไม่ต้องรอ

**ข้อยกเว้น — Informed Override (เป้าหมายเฉพาะกิจ):**
ถ้า**ผู้ใช้ร้องขอเอง**ว่าอยากปรับแรงกว่าที่ Engine แนะนำ เพราะมีเป้าหมายเฉพาะกิจ (งานแต่ง ถ่ายรูป แข่งขัน ทริป) ให้ทำแบบเทรนเนอร์จริง:
1. บอกก่อนว่า Engine แนะนำอะไรและเพราะอะไร
2. อธิบาย**ความเสี่ยงตรงๆ** (เสียกล้ามเนื้อ เหนื่อยล้า เมตาบอลิซึมช้าลง โยโย่)
3. เสนอช่วงเวลาจำกัด (แนะนำไม่เกิน 2-4 สัปดาห์) แล้วกลับมาปกติ
4. ถามยืนยัน แล้วถ้าผู้ใช้ยืนยัน ให้แนบ block นี้:
<OVERRIDE>{"delta":-300,"days":21,"reason":"เตรียมงานแต่ง"}</OVERRIDE>
(delta = kcal ที่บวก/ลบจากเป้าปกติ ติดลบ=ลด บวก=เพิ่ม, days = จำนวนวันที่ใช้)
- ห้ามเสนอ OVERRIDE เองถ้าผู้ใช้ไม่ได้ขอ และห้ามเสนอลดเกิน 500 kcal จากเป้าปกติ (ระบบมีเพดานล่างที่ 1500 kcal ชาย / 1200 kcal หญิง และไม่ต่ำกว่า 80% ของ BMR)
- ถ้าผู้ใช้อยากยกเลิก override ให้แนบ <OVERRIDE>{"cancel":true}</OVERRIDE>
- ถ้า Engine บอก [improve-data] หรือ [wait] → ให้เน้นแนะนำวิธีบันทึกข้อมูลให้แม่นขึ้น ไม่ใช่ปรับแผน
- **ตัดสินใจจาก 7-day average เสมอ ไม่ใช่น้ำหนักรายวัน** (น้ำหนักวันเดียวแกว่งจากน้ำ/เกลือ/อาหารในท้อง)
- ถ้าความแม่นยำข้อมูล < 70% ให้บอกตรงๆ ว่ายังสรุปไม่ได้ ต้องบันทึกให้แม่นก่อน
- ค่า BIA (%ไขมัน/กล้ามเนื้อ) เชื่อเฉพาะ trend 14 วันขึ้นไป อย่าตีความค่ารายวัน — รอบเอวแม่นกว่าสำหรับไขมันหน้าท้อง

พื้นฐานการออกกำลังของผู้ใช้: เดินชัน Zone 2 (60-70% max HR) ร่วมกับ weights training เป็นหลักอยู่แล้ว เวลาแนะนำแผนให้ยึดแนวนี้ เว้นแต่ผู้ใช้บอกเงื่อนไขอื่น

**1) แผนออกกำลังกาย — เมื่อผู้ใช้ขอสร้าง/ปรับแผน:**
⚠️ สำคัญมาก: แผนผูกกับ**วันในสัปดาห์จริง**เสมอ — วันที่ 1 = วันจันทร์, 2 = อังคาร, 3 = พุธ, 4 = พฤหัสบดี, 5 = ศุกร์, 6 = เสาร์, 7 = อาทิตย์
ห้ามนับ "วันนี้" เป็นวันที่ 1 เด็ดขาด (ไม่ว่าผู้ใช้จะปรับแผนวันไหนก็ตาม) เช่น ถ้าวันนี้ศุกร์ = วันที่ 5 ของแผนเสมอ
เวลาจัดแผน ให้คำนึงว่าวันเสาร์-อาทิตย์คนมักมีเวลามากกว่า และวันจันทร์เป็นวันเริ่มสัปดาห์
อธิบายด้วยภาษาคนก่อน แล้วแนบ block ต่อท้าย (ผู้ใช้จะเห็นเป็นปุ่มบันทึก) — ใส่ "rationale" อธิบายสั้นๆ ว่าทำไมออกแบบแบบนี้เสมอ เผื่อย้อนดูทีหลัง:
- สร้างแผนใหม่ทั้ง 7 วัน:
<PLAN>{"rationale":"เหตุผลสั้นๆ ว่าทำไมจัด volume/วันพักแบบนี้","days":[{"day":"วันที่ 1","focus":"...","exercises":[{"name":"...","sets":"...","muscle":"..."}]}, ... ครบ 7 วัน]}</PLAN>
- ปรับเฉพาะบางวัน (เช่น ทำไป 4 วันแล้วอยากปรับวันที่ 5-7) ให้ใส่ partial:true และระบุช่วงวัน ใส่เฉพาะวันที่ต้องการแก้:
<PLAN>{"partial":true,"startDay":5,"endDay":7,"rationale":"เหตุผลที่ปรับ เช่น ผู้ใช้บอกเหนื่อยเกิน เลยลด volume ลง","days":[{"day":"วันที่ 5","focus":"...","exercises":[...]},{"day":"วันที่ 6",...},{"day":"วันที่ 7",...}]}</PLAN>
(จำนวน object ใน days ต้องเท่ากับช่วง startDay-endDay พอดี ระบบจะรักษาวันอื่นไว้)

**2) Calorie Banking — เมื่อผู้ใช้มีเหตุพิเศษ (สัมมนา/งานเลี้ยง/เที่ยว) แล้วต้องการปรับแคลอรี่รายวัน:**
อธิบายเหตุผลก่อน แล้วแนบเป้าแคลอรี่รายวัน (เริ่มจากวันที่ผู้ใช้ระบุ หรือวันนี้) ผลรวมทั้งสัปดาห์ควรใกล้เคียงเดิมเพื่อรักษา deficit เฉลี่ย:
<DCAL>{"startDate":"today","note":"สัปดาห์มีสัมมนา","targets":[1600,1600,2000,2000,2000,1500,1500]}</DCAL>
ใส่ targets เป็นตัวเลข kcal ของแต่ละวันเรียงกัน (1-7 วัน) ถ้า startDate ใช้ "today" ได้

**3) บันทึกอาหาร — เมื่อผู้ใช้บอกว่ากินอะไรไป (เช่น ลืมกรอก):**
คำนวณค่าโภชนาการแต่ละอย่าง อธิบายสั้นๆ แล้วแนบรายการอาหาร (ผู้ใช้จะเห็นปุ่มบันทึก และเลือกวัน/มื้อเองได้):
<FOOD>{"items":[{"name":"ข้าวมันไก่","cal":600,"protein":30,"carb":70,"fat":20,"fiber":2,"sugar":3,"sodium":900},{"name":"ชาเย็น","cal":180,"protein":3,"carb":35,"fat":4,"fiber":0,"sugar":30,"sodium":40}]}</FOOD>
(fiber/sugar กรัม sodium มิลลิกรัม)
แยกอาหารแต่ละอย่างเป็น item คำนวณ cal/protein/carb/fat ตามปริมาณที่ผู้ใช้บอก ถ้าไม่ระบุปริมาณให้ประเมิน 1 หน่วยเสิร์ฟมาตรฐาน

แนบ block เฉพาะเมื่อผู้ใช้ขอจริง ถ้าแค่คุยทั่วไปห้ามใส่
${buildContext(lookbackDays)}`;
  try{
    // ประทับวันที่จริงในทุกข้อความก่อนเก็บลง history — กันความสับสนถ้าแชทค้างข้ามวัน
    // (ไม่กระทบสิ่งที่แสดงในหน้าจอ เพราะ bubbleHTML ใช้ coachMsgs แยกต่างหาก)
    coachHistory.push({role:"user",content:`[${fmtDate(todayStr())} ${todayStr()}] ${text}`});
    const reply=await callClaude({max_tokens:2500,system:sys,messages:coachHistory.slice(-8)});
    coachHistory.push({role:"assistant",content:reply});
    // แยก <PLAN>...</PLAN> และ <DCAL>...</DCAL> ออกจากข้อความ
    let cleanText=reply,planObj=null,dcalObj=null;
    const pm=reply.match(/<PLAN>([\s\S]*?)<\/PLAN>/);
    if(pm){
      cleanText=cleanText.replace(/<PLAN>[\s\S]*?<\/PLAN>/,"").trim();
      try{
        const pj=extractJSON(pm[1]);
        if(pj&&pj.days&&Array.isArray(pj.days)){
          if(pj.partial){
            const s=pj.startDay||1,e=pj.endDay||7;
            const existing=LS.get(K.plan,null);
            if(!existing||!existing.days||existing.days.length!==7){
              cleanText+=" ⚠️ ยังไม่มีแผนเดิม 7 วันให้ปรับ ลองสร้างแผนใหม่ทั้งหมดก่อนครับ";
            }else if(pj.days.length===(e-s+1)){
              planObj=pj;
            }else{
              cleanText+=` ⚠️ จำนวนวันไม่ตรงช่วง ${s}-${e} ลองใหม่ครับ`;
            }
          }else if(pj.days.length===7){
            planObj=pj;
          }else{
            cleanText+=" ⚠️ แผนไม่ครบ 7 วัน ลองใหม่ได้ครับ";
          }
        }
      }catch(err){cleanText+=" ⚠️ บันทึกแผนไม่ได้ (JSON error) ลองขอใหม่ครับ";}
    }
    const dm=reply.match(/<DCAL>([\s\S]*?)<\/DCAL>/);
    if(dm){
      cleanText=cleanText.replace(/<DCAL>[\s\S]*?<\/DCAL>/,"").trim();
      try{
        const dj=extractJSON(dm[1]);
        if(dj&&Array.isArray(dj.targets)&&dj.targets.length>=1&&dj.targets.every(x=>typeof x==="number")){
          if(dj.startDate==="today"||!dj.startDate)dj.startDate=todayStr();
          dcalObj=dj;
        }else{cleanText+=" ⚠️ ปรับแคลอรี่รายวันไม่ได้ (รูปแบบผิด) ลองใหม่ครับ";}
      }catch(err){cleanText+=" ⚠️ ปรับแคลอรี่รายวันไม่ได้ (JSON error) ลองใหม่ครับ";}
    }
    const om=reply.match(/<OVERRIDE>([\s\S]*?)<\/OVERRIDE>/);
    let ovObj=null;
    if(om){
      cleanText=cleanText.replace(/<OVERRIDE>[\s\S]*?<\/OVERRIDE>/,"").trim();
      try{
        const oj=extractJSON(om[1]);
        if(oj&&oj.cancel){ovObj={cancel:true};}
        else if(oj&&typeof oj.delta==="number"&&oj.delta!==0){
          ovObj={delta:Math.round(oj.delta),days:Math.min(60,Math.max(1,Math.round(oj.days||14))),reason:oj.reason||""};
        }else{cleanText+=" ⚠️ ปรับเป้าไม่ได้ (รูปแบบผิด) ลองใหม่ครับ";}
      }catch(err){cleanText+=" ⚠️ ปรับเป้าไม่ได้ (JSON error) ลองใหม่ครับ";}
    }
    const fm=reply.match(/<FOOD>([\s\S]*?)<\/FOOD>/);
    let foodObj=null;
    if(fm){
      cleanText=cleanText.replace(/<FOOD>[\s\S]*?<\/FOOD>/,"").trim();
      try{
        const fj=extractJSON(fm[1]);
        if(fj&&Array.isArray(fj.items)&&fj.items.length){
          foodObj={items:fj.items.map(it=>({name:it.name||"อาหาร",cal:Math.round(it.cal)||0,protein:Math.round(it.protein)||0,carb:Math.round(it.carb)||0,fat:Math.round(it.fat)||0,fiber:Math.round(it.fiber)||0,sugar:Math.round(it.sugar)||0,sodium:Math.round(it.sodium)||0}))};
        }else{cleanText+=" ⚠️ บันทึกอาหารไม่ได้ (รูปแบบผิด) ลองใหม่ครับ";}
      }catch(err){cleanText+=" ⚠️ บันทึกอาหารไม่ได้ (JSON error) ลองใหม่ครับ";}
    }
    coachMsgs.push({role:"ai",text:cleanText,plan:planObj,dcal:dcalObj,food:foodObj,ov:ovObj});
  }catch(e){coachMsgs.push({role:"ai",text:aiError(e)});}
  renderCoachUI();
}

/* ══════════════════════════════
   PROFILE FORM
══════════════════════════════ */
function viewSetup(){
  return`<div class="setup">
    <div class="setup-head">
      <div class="setup-logo">📒</div>
      <div class="setup-ttl">FitLog</div>
      <div class="setup-sub">เทรนเนอร์ส่วนตัวที่จำทุกอย่างให้คุณ — ติดตามอาหาร น้ำหนัก และแผนออกกำลังกาย</div>
    </div>
    <div class="setup-body"><div id="pform"></div></div>
  </div>`;
}
function bindSetup(){
  renderProfileForm(document.getElementById("pform"),null,"เริ่มใช้งาน →",np=>{LS.set(K.profile,np);render();});
}
function renderProfileForm(box,initial,submitLabel,onSave){
  if(!box)return;
  const lb=latestBody();
  const p=initial||{gender:"male",age:"",weight:"",height:"",activity:1.375,goal:"lose",targetWeight:"",targetBf:""};
  let sel={gender:p.gender,goal:p.goal};
  box.innerHTML=`
    <div style="margin-bottom:12px">
      <div class="flbl">เพศ</div>
      <div class="seg" id="pf-g">
        <button data-g="male" class="${p.gender==="male"?"on":""}">ชาย</button>
        <button data-g="female" class="${p.gender==="female"?"on":""}">หญิง</button>
      </div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <div class="field"><div class="flbl">อายุ</div><input id="pf-age" type="number" inputmode="decimal" value="${p.age||""}" placeholder="ปี"></div>
      <div class="field"><div class="flbl">${lb?"น้ำหนัก (เครื่องชั่ง)":"น้ำหนัก (kg)"}</div><input id="pf-w" type="number" inputmode="decimal" value="${lb?lb.weight:(p.weight||"")}" ${lb?"disabled":""} placeholder="kg"></div>
      <div class="field"><div class="flbl">ส่วนสูง (cm)</div><input id="pf-h" type="number" inputmode="decimal" value="${p.height||""}" placeholder="cm"></div>
    </div>
    <div style="margin-bottom:12px">
      <div class="flbl">ระดับกิจกรรม</div>
      <select id="pf-act" style="background:var(--bg3);color:var(--text)">
        ${ACTIVITY.map(a=>`<option value="${a.id}" ${+p.activity===a.id?"selected":""}>${a.label}</option>`).join("")}
      </select>
    </div>
    <div style="margin-bottom:12px">
      <div class="flbl">เป้าหมายหลัก</div>
      <div class="seg" id="pf-goal">
        ${GOALS.map(g=>`<button data-goal="${g.id}" class="${p.goal===g.id?"on":""}">${g.label}</button>`).join("")}
      </div>
    </div>
    <div class="goalbox" style="margin-bottom:14px">
      <div class="gt">🎯 เป้าหมายแบบละเอียด (ตั้งได้ทั้งคู่)</div>
      <div class="row">
        <div class="field"><div class="flbl">น้ำหนักเป้าหมาย (kg)</div><input id="pf-tw" type="number" inputmode="decimal" value="${p.targetWeight||""}"></div>
        <div class="field"><div class="flbl">% ไขมันเป้าหมาย</div><input id="pf-tbf" type="number" inputmode="decimal" value="${p.targetBf||""}"></div>
      </div>
    </div>
    <div class="err" id="pf-err" style="margin-bottom:8px"></div>
    <button class="btn-save" id="pf-submit">${submitLabel}</button>
  `;
  box.querySelectorAll("#pf-g button").forEach(b=>b.onclick=()=>{box.querySelectorAll("#pf-g button").forEach(x=>x.classList.remove("on"));b.classList.add("on");sel.gender=b.dataset.g;});
  box.querySelectorAll("#pf-goal button").forEach(b=>b.onclick=()=>{box.querySelectorAll("#pf-goal button").forEach(x=>x.classList.remove("on"));b.classList.add("on");sel.goal=b.dataset.goal;});
  box.querySelector("#pf-submit").onclick=()=>{
    const age=+box.querySelector("#pf-age").value,height=+box.querySelector("#pf-h").value;
    const weight=lb?lb.weight:+box.querySelector("#pf-w").value;
    if(!age||!height){setErr("pf-err","กรุณากรอกอายุและส่วนสูง");return;}
    if(!lb&&!weight){setErr("pf-err","กรุณากรอกน้ำหนัก");return;}
    onSave({gender:sel.gender,goal:sel.goal,age,height,weight,activity:+box.querySelector("#pf-act").value,targetWeight:+box.querySelector("#pf-tw").value||null,targetBf:+box.querySelector("#pf-tbf").value||null});
  };
}

/* ── utils ── */
let _sheetOverlay=null;
function showSheet(html,fullH){
  closeSheet();
  const o=document.createElement("div");o.className="overlay";o.id="overlay";
  o.innerHTML=`<div class="sheet" id="sheet" style="${fullH?"max-height:96vh;":""}">${html}</div>`;
  o.onclick=e=>{if(e.target===o)closeSheet();};
  document.body.appendChild(o);_sheetOverlay=o;
}
function closeSheet(){const o=document.getElementById("overlay");if(o)o.remove();_sheetOverlay=null;}
function setErr(id,msg){const e=document.getElementById(id);if(e)e.textContent=msg;}
function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);
}
/* PR celebration overlay */
function prCelebrate(exName,detail){
  const o=document.createElement("div");
  o.style.cssText="position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);animation:fadeIn .2s";
  o.innerHTML=`<div style="background:var(--card);border:1px solid var(--accent);border-radius:var(--r-xl);padding:32px 28px;text-align:center;max-width:300px;margin:20px;box-shadow:0 12px 48px var(--accent-glow);animation:popIn .35s cubic-bezier(.2,1.3,.4,1)">
    <div style="font-size:52px;margin-bottom:8px">🎉</div>
    <div style="font-size:20px;font-weight:900;color:var(--accent2);margin-bottom:6px">สถิติใหม่!</div>
    <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">${esc(exName)}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:18px">${esc(detail)}</div>
    <button id="pr-ok" class="btn-save">เยี่ยมมาก! 💪</button>
  </div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector("#pr-ok").onclick=close;
  o.onclick=e=>{if(e.target===o)close();};
  setTimeout(close,5000);
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

render();
